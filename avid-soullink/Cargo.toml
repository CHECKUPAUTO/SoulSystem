[package]
name = "avid-soullink"
version = "0.1.0"
edition = "2021"
description = "Bridge entre AVID et SoulLink — Blackboard, Memori, Intents"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"
tracing = "0"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
time = "0.3"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
