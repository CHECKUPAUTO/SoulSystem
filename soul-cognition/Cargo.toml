[package]
name = "soul_cognition"
version = "0.1.0"
edition = "2021"
description = "Cognitive coordination layer for the autonomous agent: observation provenance (Observed/Deduced/Hypothetical), a single Level-2 confirmation gate, and an artificial-curiosity scorer. Wires the existing memory, planner and soul-rsi experimentation loop together while enforcing the honesty invariants."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
soul_tools = { path = "../soul_tools" }

[lints]
workspace = true
