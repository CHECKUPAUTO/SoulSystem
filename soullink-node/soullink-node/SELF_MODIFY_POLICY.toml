# Constitutional policy for the SoulLink self-modification engine.
# Hard-coded immutable rules (in constitutional_guard.rs) always override
# anything declared here, making the system structurally incapable of disabling
# its own safeguards.

# Maximum number of lines a single patch may touch.
max_patch_lines = 500

# Strategies that are forbidden regardless of context.
forbidden_strategies = ["GeneticMutate", "ModuleReorg"]

# Whether all patches must pass the test suite.
require_tests = true

# Whether Cargo.toml may be modified by patches.
# This is set to false by default to prevent supply-chain attacks.
allow_cargo_toml = false
