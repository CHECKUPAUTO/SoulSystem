[package]
name = "soullink-ssm"
version = "0.1.0"
edition = "2021"
description = "Mamba-style State Space Model implementation in Rust"

[features]
default = []
cuda = ["cc"]

[dependencies]
ndarray = "0.16"
ndarray-rand = "0.15"
rand = "0.8"
rand_distr = "0.4"
num-complex = "0.4"
approx = "0.5"

[build-dependencies]
cc = { version = "1.0", optional = true }

[[example]]
name = "mamba_demo"
path = "examples/mamba_demo.rs"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"
