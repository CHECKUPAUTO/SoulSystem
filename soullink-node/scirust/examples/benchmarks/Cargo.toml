[package]
name = "benchmarks"
version = "0.1.0"
edition = "2024"

[dependencies]
scirust-core = { path = "/root/scirust/scirust-core" }
scirust-autodiff = { path = "/root/scirust/scirust-autodiff" }
scirust-inference = { path = "/root/scirust/scirust-inference" }
scirust-probability = { path = "/root/scirust/scirust-probability" }
scirust-quantum = { path = "/root/scirust/scirust-quantum" }
scirust-distributed = { path = "/root/scirust/scirust-distributed" }
scirust-simd = { path = "/root/scirust/scirust-simd" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "simd_vs_scalar"
harness = false

[[bench]]
name = "mlp_inference"
harness = false

[[bench]]
name = "inference_gemm"
harness = false

[[bench]]
name = "bayesian_inference"
harness = false

[[bench]]
name = "quantum_sim"
harness = false

[[bench]]
name = "autodiff_bench"
harness = false
