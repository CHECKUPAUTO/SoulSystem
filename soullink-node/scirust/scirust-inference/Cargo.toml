[package]
name = "scirust-inference"
version = "0.1.0"
edition = "2021"
description = "Industrial-grade inference engine for SciRust: tensor ops, NN layers, quantization, graph optimization"
license = "MIT OR Apache-2.0"

[dependencies]
scirust-simd = { path = "../scirust-simd" }
scirust-autodiff = { path = "../scirust-autodiff" }
rayon = { version = "1.10", optional = true }
ndarray = "0.15"
# Optional because the `serialization` feature lists them; a feature that
# names a non-optional dependency is a manifest error, not a no-op.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
half = { version = "2", optional = true }

[features]
default = ["parallel"]
parallel = ["rayon"]
serialization = ["serde", "serde_json"]
quantization = ["half"]
full = ["parallel", "serialization", "quantization"]
