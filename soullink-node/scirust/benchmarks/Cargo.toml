[package]
name = "benchmarks"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "bench_force"
path = "src/bin/bench_force.rs"

[dependencies]
scirust-simd = { path = "/root/scirust/scirust-simd" }
scirust-gpu = { path = "/root/scirust/scirust-gpu" }
scirust-core = { path = "/root/scirust/scirust-core" }
chrono = "0.4"
rand = "0.8"

[features]
simd-avx512 = ["scirust-simd/simd-avx512"]
gpu-cuda = ["scirust-gpu/gpu-cuda"]
gpu-uma = ["scirust-gpu/gpu-uma"]
default = []
