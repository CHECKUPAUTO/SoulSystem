[package]
name = "scirust-web"
version = "0.1.0"
edition = "2021"
description = "Web UI and WASM bindings for SciRust inference"

[dependencies]
scirust-inference = { path = "../scirust-inference" }
scirust-probability = { path = "../scirust-probability" }
scirust-quantum = { path = "../scirust-quantum" }
scirust-distributed = { path = "../scirust-distributed" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = []
wasm = ["wasm-bindgen", "js-sys"]
