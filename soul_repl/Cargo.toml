[package]
name = "soul_repl"
version = "0.1.0"
edition = "2021"
description = "Interactive TUI for autonomous entity with LLM integration, planning, tool execution, and sandboxed environment"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/OS-AGENTS"
keywords = ["tui", "repl", "interactive", "llm", "autonomous", "entity"]
categories = ["development-tools", "machine-learning", "command-line-utilities"]

[dependencies]
soul_llm = { path = "../soul_llm" }
soul_planner = { path = "../soul_planner" }
soul_tools = { path = "../soul_tools" }
soul_sandbox = { path = "../soul_sandbox" }
soul_persistence = { path = "../soul_persistence" }
ratatui = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
colored = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
dirs = { workspace = true }
