[package]
name = "soul_repl"
version = "0.2.0"
edition = "2021"
description = "Interactive REPL with autonomous agent, conversation context, and streaming"

[dependencies]
soul_llm = { path = "../soul_llm" }
soul_planner = { path = "../soul_planner" }
soul_tools = { path = "../soul_tools" }
soul_bridges = { path = "../soul_bridges" }
soul_cognitive = { path = "../soul_cognitive" }
soul_automation = { path = "../soul_automation" }
soul_security = { path = "../soul_security" }
soul_monitor = { path = "../soul_monitor" }
soul_agent_core = { path = "../soul-agent-core" }
soul_skills = { path = "../soul-skills" }
soul_subagents = { path = "../soul-subagents" }
soul_webfetch = { path = "../soul-webfetch" }
soul_rag = { path = "../soul-rag" }
soul_mcp = { path = "../soul-mcp" }
soul_graph_memory = { path = "../soul-graph-memory" }
soul_persist = { path = "../soul-persist" }
soul_designtree = { path = "../soul-designtree" }
soul_inference = { path = "../soul-inference" }
soul_conversations = { path = "../soul-conversations" }
soul_critique = { path = "../soul-critique" }
soul-dashboard = { path = "../crates/soul-dashboard" }
rustyline = "14"
colored = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
