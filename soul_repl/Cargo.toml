[package]
name = "soul_repl"
version = "0.1.0"
edition = "2021"
description = "Interactive REPL for autonomous entity with LLM integration, planning, tool execution, and sandboxed environment"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/OS-AGENTS"
keywords = ["repl", "interactive", "llm", "autonomous", "entity", "planning", "tools", "sandbox"]
categories = ["development-tools", "machine-learning", "embedded"]

[dependencies]
soul_llm = { path = "../soul_llm" }
soul_planner = { path = "../soul_planner" }
soul_tools = { path = "../soul_tools" }
soul_sandbox = { path = "../soul_sandbox" }
soul_persistence = { path = "../soul_persistence" }
rustyline = "15"
colored = "3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
