[package]
name = "soul_repl"
version = "0.1.0"
edition = "2021"
description = "REPL interactif pour l'entité autonome"

[dependencies]
soul_llm = { path = "../soul_llm" }
soul_planner = { path = "../soul_planner" }
soul_tools = { path = "../soul_tools" }
rustyline = "15"
colored = "3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
