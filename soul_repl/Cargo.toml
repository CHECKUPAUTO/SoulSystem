[package]
name = "soul_repl"
version = "0.1.0"
edition = "2021"
description = "Interactive TUI for autonomous entity with LLM integration, planning, tool execution, and sandboxed environment"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/OS-AGENTS"
keywords = ["tui", "repl", "interactive", "llm", "autonomous", "entity"]
categories = ["development-tools", "machine-learning", "command-line-utilities"]

[dependencies]
soul_llm = { path = "../soul_llm" }
soul_planner = { path = "../soul_planner" }
soul_tools = { path = "../soul_tools" }
soul_agent_core = { path = "../soul-agent-core" }
soul_webfetch = { path = "../soul-webfetch" }
soul-memory = { workspace = true, features = ["web"] }
soul_skills = { path = "../soul-skills" }
soul_designtree = { path = "../soul-designtree" }
soul_inference = { path = "../soul-inference" }
soul_critique = { path = "../soul-critique" }
soul_compaction = { path = "../soul-compaction" }
soul_mcp = { path = "../soul-mcp" }
soul_subagents = { path = "../soul-subagents" }
soul-dashboard = { path = "../crates/soul-dashboard" }
rustyline = "14"
colored = "2"
serde_json = "1"
tokio = { workspace = true }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
