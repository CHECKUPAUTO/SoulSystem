[package]
name = "forge-core"
version = "0.1.0"
edition = "2021"
description = "Moteur de recherche evolutionnaire d'algorithmes pilote par execution. Terrain d'execution: scirust."
license = "MIT OR Apache-2.0"

[dependencies]
rand = { workspace = true }
rayon = "1.10"
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "2", features = ["json"], optional = true }

[features]
default = []
# Active le generateur de candidats par LLM (client Ollama bloquant).
llm = ["dep:ureq"]
