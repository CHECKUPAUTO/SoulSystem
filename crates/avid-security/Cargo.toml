[package]
name = "avid-security"
version = "0.1.0"
edition = "2021"
description = "Agentic security pipeline — understand, validate, exploit, patch"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
tracing = "0.1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "avid_security"
path = "src/lib.rs"
