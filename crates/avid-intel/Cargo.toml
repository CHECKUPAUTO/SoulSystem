[package]
name = "avid-intel"
version = "0.1.0"
edition = "2021"
description = "CVE/OSINT monitoring — alimente SYNERGIE"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "avid_intel"
path = "src/lib.rs"
