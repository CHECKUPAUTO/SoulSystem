[package]
name = "soul_telemetry"
version = "0.1.0"
edition = "2021"
description = "Real-time telemetry hub with thermal sampling, execution latency tracking, and per-core metrics for scheduler observability"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/OS-AGENTS"
keywords = ["telemetry", "thermal", "monitoring", "latency", "observability"]
categories = ["monitoring", "embedded", "os"]

[dependencies]
prometheus = "0.13"
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
lazy_static = "1.4"
