[package]
name = "soul_persistence"
version = "0.1.0"
edition = "2021"
description = "Persistent memory layer using Sled KV store with lineage registry for parent tracking and event sourcing"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/OS-AGENTS"
keywords = ["persistence", "sled", "kv-store", "lineage", "event-sourcing", "memory"]
categories = ["database", "embedded", "data-structures"]

[dependencies]
sled = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
thiserror = "1"
