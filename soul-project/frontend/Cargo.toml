[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
leptos = { version = "0.7", features = ["csr"] }
leptos_router = { version = "0.7" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["EventSource", "MessageEvent", "Window", "Response", "ReadableStream", "ReadableStreamDefaultReader", "RequestInit", "Headers"] }
serde = { workspace = true }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
chrono = { workspace = true }
futures = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = "0.6"
