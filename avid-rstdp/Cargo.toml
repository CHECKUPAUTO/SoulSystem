[package]
name = "avid-rstdp"
version = "0.1.0"
edition = "2021"
description = "R-STDP pattern reinforcement — AVID → nCPU compiler"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["sync", "time", "rt"] }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
time = "0.3"
