[package]
name = "services-bridge"
version = "0.1.0"
edition = "2021"
description = "Pont SoulSystem ↔ services tiers du serveur (ollama, omniclaw, onaeu, turboquant, soulbridge, NATS, crowdsec, mirofish, super-tool, qmd-mcp, sl13-monolith, novnc)"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
