# cargo-audit configuration
# Run: cargo audit
#
# RUSTSEC-2026-0235 (rkyv): rust_decimal 1.42.1, the latest stable release,
# declares rkyv ^0.7.46 as an optional dependency. SoulSystem does not enable
# rust_decimal's `rkyv` or `rkyv-safe` features, so cargo-deny does not resolve
# rkyv in the active workspace graph. RustSec only provides a fix in rkyv
# >=0.8.17, while rust_decimal 1.42.1 still pins the unsupported 0.7 line.
# Do not enable those rust_decimal features. Remove this exception when a stable
# rust_decimal release no longer locks rkyv 0.7.x.

[advisories]
ignore = [
    "RUSTSEC-2026-0235",
]
