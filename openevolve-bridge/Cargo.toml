[package]
name = "openevolve-bridge"
version = "0.1.0"
edition = "2021"
description = "Pont OpenEvolve ↔ SoulSystem — client HTTP réel"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
openevolve = { path = "../openevolve", optional = true }

[features]
default = []
openevolve = ["dep:openevolve"]
