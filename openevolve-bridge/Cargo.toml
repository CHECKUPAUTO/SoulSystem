[package]
name = "openevolve-bridge"
version = "0.1.0"
edition = "2021"
description = "Pont OpenEvolve ↔ SoulSystem — client HTTP réel"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
openevolve = { path = "../openevolve", optional = true }

[features]
default = []
openevolve = ["dep:openevolve"]
