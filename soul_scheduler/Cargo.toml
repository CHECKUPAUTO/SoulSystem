[package]
name = "soul_scheduler"
version = "0.1.0"
edition = "2021"
description = "Cooperative lock-free work-stealing scheduler with NUMA awareness, CPU affinity pinning, and hardware topology detection"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/OS-AGENTS"
keywords = ["scheduler", "work-stealing", "numa", "cpu-affinity", "lock-free"]
categories = ["concurrency", "os", "embedded"]

[dependencies]
libc = "0.2.155"
soul_telemetry = { path = "../soul_telemetry" }
prometheus = "0.13"
lazy_static = "1.4"
tracing = "0.1"

[[bench]]
name = "scheduler_benchmarks"
path = "benches/scheduler_benchmarks.rs"
harness = false

[dev-dependencies]
criterion = "0.5"
