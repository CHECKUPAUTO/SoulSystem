[package]
name = "soul-memory-store"
version.workspace = true
edition.workspace = true
description = "HNSW-based vector store for scalable memory retrieval"

[dependencies]
serde = { workspace = true }
bincode = "1"
anyhow = "1"
tokio = { workspace = true }
parking_lot = "0.12"
lazy_static = "1"
prometheus = { version = "0.13", features = ["process"] }
log = "0.4"
seahash = "1"
tempfile = "3"
