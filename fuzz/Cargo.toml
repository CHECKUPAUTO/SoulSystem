[package]
name = "avid-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
avid-scout = { path = "../crates/avid-scout" }
avid-core = { path = "../crates/avid-core" }

[[bin]]
name = "fuzz_arxiv_parser"
path = "fuzz_targets/fuzz_arxiv_parser.rs"

[[bin]]
name = "fuzz_web_parser"
path = "fuzz_targets/fuzz_web_parser.rs"
