[package]
name = "soulsystem-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

# Crates to fuzz
soul_llm = { path = "../soul_llm" }
soulsystem = { path = ".." }
serde = { workspace = true }
serde_json = "1"
toml = { workspace = true }

# Prevent this from being part of the workspace
[lib]
path = "lib.rs"

[[bin]]
name = "llm_response_parser"
path = "fuzz_targets/llm_response_parser.rs"
test = false
doc = false

[[bin]]
name = "config_parser"
path = "fuzz_targets/config_parser.rs"
test = false
doc = false

[[bin]]
name = "tool_call_args"
path = "fuzz_targets/tool_call_args.rs"
test = false
doc = false

[[bin]]
name = "code_signing_signature"
path = "fuzz_targets/code_signing_signature.rs"
test = false
doc = false
