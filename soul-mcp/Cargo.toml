[package]
name = "soul_mcp"
version = "0.1.0"
edition = "2021"
description = "MCP (Model Context Protocol) client + server + transport for SoulSystem"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "process", "net"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
futures = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
