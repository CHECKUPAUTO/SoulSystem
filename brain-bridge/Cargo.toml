[package]
name = "brain-bridge"
version = "0.1.0"
edition = "2021"
description = "Pont Brain System ↔ SoulSystem — client HTTP réel vers 6 organes HNN"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
brain-system-rs = { path = "../brain-system-rs", optional = true }

[features]
default = []
brain = ["dep:brain-system-rs"]
