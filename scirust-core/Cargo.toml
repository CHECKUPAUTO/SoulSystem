[package]
name = "scirust-core"
version = "0.1.0"
edition = "2021"
description = "SciRust core — scientific computing engine for SoulLink ecosystem"

[dependencies]
num_cpus = "1"
scirust-autodiff = { path = "../scirust-autodiff" }
scirust-macros = { path = "../scirust-macros" }
scirust-simd = { path = "../scirust-simd" }
scirust-gpu-macros = { path = "../scirust-gpu-macros" }
rand = "0.9"
ndarray = "0.16"
matrixmultiply = "0.3.10"
num-bigint = "0.4"
num-traits = "0.2"
half = "2.4"
blas = { version = "0.22", optional = true }
rayon = { version = "1", optional = true }

[features]
default = []
gpu = []
portable-simd = ["scirust-simd/portable-simd"]
# Backend BLAS (OpenBLAS/MKL) — nécessite une implémentation BLAS système.
blas = ["dep:blas"]
# Parallélisation des GEMM par rayon.
rayon = ["dep:rayon"]
