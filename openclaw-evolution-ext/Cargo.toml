[package]
name = "openclaw"
version = "0.3.0"
edition = "2021"
description = "OpenClaw Evolution System — Self-improving audited computational ecosystem"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
dashmap = "6"
rayon = "1.10"
serde = { workspace = true }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
scraper = "0.21"
url = "2"
anyhow = "1"
thiserror = "2"
futures = "0.3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
