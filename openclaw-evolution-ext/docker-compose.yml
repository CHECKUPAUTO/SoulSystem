version: "3.8"

services:
  openclaw-evo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-evolution
    restart: unless-stopped
    network_mode: host

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      - openclaw-data:/opt/openclaw/data
      - openclaw-logs:/opt/openclaw/logs

    env_file:
      - .env

    healthcheck:
      test: ["CMD", "pgrep", "-f", "openclaw"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  openclaw-data:
    driver: local
  openclaw-logs:
    driver: local
