# OpenEvolve — T430 quick profile (50 iterations)
# Use: openevolve --quick -c configs/openclaw_t430_quick.toml

[evolution]
max_iterations      = 50
quick_iterations    = 25
checkpoint_interval = 10
log_level           = "info"

[llm]
primary_model    = "qwen2.5-coder:3b"
secondary_model  = "qwen2.5-coder:3b"
primary_weight   = 0.65
api_base         = "http://localhost:11434/api"
temperature      = 0.9
max_tokens       = 4096
timeout_secs     = 120

[database]
population_size    = 50
num_islands        = 2
migration_interval = 10
elite_fraction     = 0.20
output_dir         = "openevolve_output_quick"

[evaluator]
evaluator_bin = "./examples/my_task/target/release/evaluator"
timeout_secs  = 30
sandbox       = true
