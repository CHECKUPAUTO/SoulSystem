# OpenEvolve — Dell PowerEdge T430 profile (high intensity)
# Use: openevolve -c configs/openclaw_t430.toml

[evolution]
max_iterations      = 500
quick_iterations    = 50
checkpoint_interval = 25
log_level           = "info"

[llm]
primary_model    = "qwen2.5-coder:3b"
secondary_model  = "qwen2.5-coder:3b"
primary_weight   = 0.65
api_base         = "http://localhost:11434/api"
temperature      = 0.8
max_tokens       = 4096
timeout_secs     = 180

[database]
population_size    = 200
num_islands        = 4
migration_interval = 20
elite_fraction     = 0.10
output_dir         = "openevolve_output_t430"

[evaluator]
evaluator_bin = "./examples/my_task/target/release/evaluator"
timeout_secs  = 60
sandbox       = true
