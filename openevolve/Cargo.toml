[workspace]

[package]
name         = "openevolve"
version      = "4.3.0"
edition      = "2021"
rust-version = "1.82"
description  = "OpenEvolve — Evolutionary code optimization via LLM, 100% Rust"
authors      = ["CortexSynapse"]
license      = "MIT"
repository   = "https://github.com/CHECKUPAUTO/openevolve"

[[bin]]
name = "openevolve"
path = "src/main.rs"

[lib]
name = "openevolve"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
tokio    = { version = "1", features = ["full", "test-util"] }

[dependencies]
tokio        = { version = "1",    features = ["full"] }
# reqwest 0.11 avec blocking feature native-tls (évite rustls/idna)
reqwest      = { version = "0.11", default-features = false, features = ["json", "native-tls"] }
# Force url 2.4 pour éviter idna 1.0+ qui requiert Rust 1.86
url          = "=2.4.0"
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
toml         = "0.8"
clap         = { version = "4",    features = ["derive"] }
chrono       = { version = "0.4",  features = ["serde"] }
uuid         = { version = "1",    features = ["v4"] }
rand         = "0.8"
regex        = "1"
walkdir      = "2"
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
colored      = "2"
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-go = "0.25.0"
axum = { version = "0.8.9", features = ["ws"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6.10", features = ["cors"] }
futures-util = "0.3.32"
serde_yaml = "0.9.34"
similar = "3.1.0"
which = "8.0.2"

pretty_assertions = "1"

async-trait = "0.1"

thiserror = "1"

once_cell = "1"

sha2 = "0.10"

hex = "0.4"

parking_lot = "0.12"

# Persistence
rusqlite     = { version = "0.32", features = ["bundled"] }
r2d2         = "0.8"
r2d2_sqlite  = "0.25"

# Metrics
metrics                     = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }

# Map-Elites support
indexmap = "2"

tower_governor = { version = "0.8", features = ["axum"] }

scopeguard = "1"

[profile.release]
opt-level = 3
lto       = true
strip     = true
codegen-units = 1
