
[package]
name         = "openevolve"
version      = "4.3.0"
edition      = "2021"
rust-version = "1.82"
description  = "OpenEvolve — Evolutionary code optimization via LLM, 100% Rust"
authors      = ["CortexSynapse"]
license      = "MIT"
repository   = "https://github.com/CHECKUPAUTO/openevolve"

[[bin]]
name = "openevolve"
path = "src/main.rs"

[lib]
name = "openevolve"
path = "src/lib.rs"

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["test-util"] }

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
url = "2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
walkdir = "2"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
colored = "2"
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-go = "0.25.0"
axum = { workspace = true, features = ["ws"] }
tower = { workspace = true, features = ["limit", "util"] }
tower-http = { workspace = true, features = ["cors"] }
futures-util = "0.3.32"
serde_yaml = "0.9.34"
similar = "3.1.0"
which = "8.0.2"
pretty_assertions = "1"
async-trait = { workspace = true }
thiserror = { workspace = true }
once_cell = "1"
sha2 = "0.10"
hex = "0.4"
parking_lot = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
indexmap = "2"
tower_governor = { version = "0.8", features = ["axum"] }
scopeguard = "1"
