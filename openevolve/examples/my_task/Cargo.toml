[workspace]
members = []

[package]
name    = "my_task"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "evaluator"
path = "src/evaluator.rs"

[[bin]]
name = "solution_runner"
path = "src/solution.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rand       = "0.8"
