[package]
name = "soul_browser"
version = "0.1.0"
edition = "2021"
description = "Headless Chrome automation via CDP"

[dependencies]
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
