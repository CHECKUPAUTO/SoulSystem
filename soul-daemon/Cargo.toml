[package]
name = "soul_daemon"
version = "0.1.0"
edition = "2021"
description = "Background autonomous loop with persistent goals and sub-agent support"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
soul_agent_core = { path = "../soul-agent-core" }
soul_llm = { path = "../soul_llm" }
soul_planner = { path = "../soul_planner" }
soul_tools = { path = "../soul_tools" }
soul-memory = { workspace = true }
soul_subagents = { path = "../soul-subagents" }
soul_eventbus = { path = "../soul-eventbus" }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
