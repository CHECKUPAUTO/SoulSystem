[package]
name = "soul_agent_runtime"
version = "0.1.0"
edition = "2021"
description = "Cognitive agent runtime integrating scheduler, matrix engine, vector storage, IPC, and orchestrator for sovereign agent execution loops"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/OS-AGENTS"
keywords = ["agent", "runtime", "cognitive", "scheduler", "matrix", "ipc", "orchestrator"]
categories = ["embedded", "os", "machine-learning"]

[dependencies]
soul_scheduler = { path = "../soul_scheduler" }
soul_matrix_engine = { path = "../soul_matrix_engine" }
soul_storage = { path = "../soul_storage" }
soul_ipc = { path = "../soul_ipc" }
soul_orchestrator = { path = "../soul_orchestrator" }
soul_telemetry = { path = "../soul_telemetry" }
tracing = "0.1"
