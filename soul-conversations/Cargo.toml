[package]
name = "soul_conversations"
version = "0.1.0"
edition = "2021"
description = "SQLite-backed conversation persistence"

[dependencies]
serde = { workspace = true }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { workspace = true }
tracing = "0.1"
thiserror = "2"
chrono = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
