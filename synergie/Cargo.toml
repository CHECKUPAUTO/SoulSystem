[package]
name = "synergie"
version = "0.3.0"
edition = "2021"
authors = ["SoulLink <soullink@checkupauto.ai>"]
description = "Agent autonome de détection de synergies dans l'écosystème SoulLink"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/SYNERGIE"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "process"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }
walkdir = "2"
scirust-symbolic = { path = "../scirust-symbolic" }
regex = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
sled = "0.34"
bincode = "1"
scirust-autodiff = { path = "../scirust-autodiff" }
scirust-core = { path = "../scirust-core" }
axum = { workspace = true, features = ["ws", "query"] }
tower-http = { workspace = true }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = "1"
rayon = "1"
git2 = { version = "0.19", default-features = false, features = ["vendored-openssl"] }
petgraph = "0.6"
blake3 = "1"
twox-hash = "1"
chrono = { workspace = true }
uuid = { workspace = true }
once_cell = "1"
dashmap = { workspace = true }
hex = "0.4"
ignore = "0.4"
clap = { workspace = true }
toml = { workspace = true }
futures-util = { version = "0.3", features = ["sink"] }

[dev-dependencies]
tempfile = { workspace = true }
