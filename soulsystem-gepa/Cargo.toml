[package]
name = "soulsystem-gepa"
version = "0.2.0"
edition = "2021"
description = "GEPA — Génération et Packaging d'Évolution. Optimise les compétences par auto-évolution."

[dependencies]
rayon = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
syn = { version = "2", features = ["full", "parsing", "printing", "visit-mut", "visit"] }
proc-macro2 = "1"
quote = "1"
prettyplease = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
walkdir = "2"
fs-err = "2"
confy = "0.6"
tempfile = "3"
regex = "1"
