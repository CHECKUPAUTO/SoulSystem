[package]
name = "soulsystem-gepa"
version = "0.1.0"
edition = "2021"
description = "GEPA — Génération et Packaging d'Évolution. Optimise les compétences par auto-évolution."

[dependencies]
openevolve = { path = "/root/openevolve" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
regex = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
