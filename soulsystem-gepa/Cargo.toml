[package]
name = "soulsystem-gepa"
version = "0.2.0"
edition = "2021"
description = "GEPA — Génération et Packaging d'Évolution. Optimise les compétences par auto-évolution."

[dependencies]
rayon = "1.8"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
syn = { version = "2", features = ["full", "parsing", "printing", "visit-mut", "visit"] }
proc-macro2 = "1"
quote = "1"
prettyplease = "0.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
walkdir = "2"
fs-err = "2"
confy = "0.6"
tempfile = { workspace = true }
regex = { workspace = true }
