[package]
name = "sft-generator"
version = "0.1.0"
edition = "2021"
description = "Generates supervised fine-tuning (SFT) instruction/response pairs from the SoulSystem Rust workspace by parsing the real public API surface, doc comments, and tests."

[[bin]]
name = "sft-generator"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "parsing", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde_json = "1"
walkdir = "2"
rayon = "1"

# Isolate this tool from the 313-crate parent workspace so building it does
# not pull the entire monorepo. The empty table makes this its own root.
[workspace]
