[package]
name = "scirust-gpu"
version = "0.6.0"
edition = "2021"

[dependencies]
rayon = { version = "0.6.0", optional = true }
cudarc = { version = "0.6.0"] }
wgpu = { version = "0.6.0", optional = true }
pollster = { version = "0.6.0", optional = true }
bytemuck = { version = "0.6.0", optional = true }
half = "2.5"
scirust-core = { path = "../scirust-core", optional = true }

[features]
default = ["cpu-fallback"]
cpu-fallback = ["rayon"]
cuda = ["dep:cudarc"]
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:scirust-core"]
