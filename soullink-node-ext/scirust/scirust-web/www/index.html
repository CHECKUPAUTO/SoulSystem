<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SciRust Inference UI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        h1 { font-size: 2rem; background: linear-gradient(135deg, #818cf8, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
        .subtitle { color: #64748b; margin-bottom: 2rem; }
        .card { background: #1e293b; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #334155; }
        .card h2 { font-size: 1.25rem; margin-bottom: 1rem; color: #94a3b8; }
        canvas { width: 140px; height: 140px; border: 2px solid #334155; border-radius: 8px; cursor: crosshair; display: block; margin: 0 auto; touch-action: none; }
        .draw-area { text-align: center; margin: 1rem 0; }
        button { background: #6366f1; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: all 0.2s; margin: 0.5rem; }
        button:hover { background: #4f46e5; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button.secondary { background: #334155; }
        button.secondary:hover { background: #475569; }
        #result { font-size: 1.25rem; margin-top: 1rem; padding: 1rem; background: #0f172a; border-radius: 8px; }
        .pred-bar { display: flex; align-items: center; margin: 0.25rem 0; gap: 0.5rem; }
        .pred-label { min-width: 2rem; font-weight: bold; }
        .pred-fill { height: 1.5rem; border-radius: 4px; background: linear-gradient(90deg, #6366f1, #a78bfa); transition: width 0.3s; min-width: 4px; }
        .pred-val { min-width: 4rem; text-align: right; font-family: monospace; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; margin: 1rem 0; }
        .stat { background: #0f172a; padding: 0.75rem; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #818cf8; }
        .stat-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; }
        .loading { display: inline-block; width: 1rem; height: 1rem; border: 2px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .badge { display: inline-block; background: #059669; color: white; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem; margin-left: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 SciRust Inference</h1>
        <p class="subtitle">Moteur d'inférence scientifique — Reconnaissance de chiffres MNIST</p>

        <div class="stats">
            <div class="stat"><div class="stat-value" id="modelStatus">—</div><div class="stat-label">Modèle</div></div>
            <div class="stat"><div class="stat-value" id="latency">—</div><div class="stat-label">Latence (ms)</div></div>
            <div class="stat"><div class="stat-value" id="throughput">—</div><div class="stat-label">Requêtes</div></div>
        </div>

        <div class="card">
            <h2>✏️ Dessinez un chiffre (0-9)</h2>
            <div class="draw-area">
                <canvas id="canvas" width="140" height="140"></canvas>
                <div>
                    <button id="predictBtn" class="secondary">🔮 Prédire</button>
                    <button id="clearBtn">🗑️ Effacer</button>
                </div>
            </div>
            <div id="result"></div>
        </div>

        <div class="card">
            <h2>📊 Distribution des probabilités</h2>
            <div id="probabilities"></div>
        </div>

        <div class="card">
            <h2>⚙️ Serveur</h2>
            <p id="serverInfo">Connecté à <code>http://localhost:8080</code></p>
            <button id="healthBtn" class="secondary">🩺 Health Check</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        // Initialize canvas
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 140, 140);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';

        canvas.addEventListener('mousedown', () => drawing = true);
        canvas.addEventListener('mouseup', () => drawing = false);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', e => { drawing = true; drawTouch(e); });
        canvas.addEventListener('touchend', () => drawing = false);
        canvas.addEventListener('touchmove', drawTouch);

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (140 / rect.width);
            const y = (e.clientY - rect.top) * (140 / rect.height);
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        function drawTouch(e) {
            e.preventDefault();
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = (touch.clientX - rect.left) * (140 / rect.width);
            const y = (touch.clientY - rect.top) * (140 / rect.height);
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 140, 140);
            document.getElementById('result').innerHTML = '';
            document.getElementById('probabilities').innerHTML = '';
        });

        document.getElementById('predictBtn').addEventListener('click', predict);

        async function predict() {
            const imageData = ctx.getImageData(0, 0, 140, 140);
            const pixels = [];
            for (let i = 3; i < imageData.data.length; i += 4) {
                pixels.push(imageData.data[i] / 255.0);
            }

            document.getElementById('result').innerHTML = '<div class="loading"></div>';

            const start = performance.now();
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: pixels, shape: [1, 196] })
                });
                const result = await response.json();
                const latency = (performance.now() - start).toFixed(1);

                document.getElementById('latency').textContent = latency + 'ms';
                document.getElementById('modelStatus').textContent = '✅ Actif';

                if (result.prediction) {
                    const preds = result.prediction;
                    const maxIdx = preds.indexOf(Math.max(...preds));
                    document.getElementById('result').innerHTML =
                        `🎯 Prédiction : <strong>${maxIdx}</strong> ` +
                        `(confiance : ${(preds[maxIdx] * 100).toFixed(1)}%) ` +
                        `<span class="badge">${latency}ms</span>`;

                    // Show probability distribution
                    const probsHtml = preds.map((p, i) => {
                        const pct = (p * 100).toFixed(1);
                        const width = Math.max(p * 100, 0.5);
                        return `<div class="pred-bar">
                            <span class="pred-label">${i}</span>
                            <div class="pred-fill" style="width: ${width}%"></div>
                            <span class="pred-val">${pct}%</span>
                        </div>`;
                    }).join('');
                    document.getElementById('probabilities').innerHTML = probsHtml;
                }
            } catch (err) {
                document.getElementById('result').innerHTML =
                    `<span style="color: #ef4444;">❌ Erreur : ${err.message}</span>`;
                document.getElementById('modelStatus').textContent = '❌ Hors ligne';
            }
        }

        document.getElementById('healthBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/health');
                const text = await response.text();
                alert('✅ Serveur OK : ' + text);
            } catch (err) {
                alert('❌ Serveur hors ligne : ' + err.message);
            }
        });

        // Initial health check
        fetch('/health').then(r => {
            if (r.ok) document.getElementById('modelStatus').textContent = '✅ Actif';
        }).catch(() => {
            document.getElementById('modelStatus').textContent = '❌ Hors ligne';
        });
    </script>
</body>
</html>
