[package]
name = "soul_scheduler"
version = "0.1.0"
edition = "2021"
description = "Cron-like scheduler for autonomous tasks"

[dependencies]
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
tracing = "0.1"
chrono = { workspace = true }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"