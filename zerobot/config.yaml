# ZeroBot Configuration
# Paths and settings for the vulnerability research assistant

paths:
  binary_store: /zerobot/sessions
  knowledge_base: /zerobot/knowledge/documents
  chromadb_persist: /zerobot/data/chromadb

models:
  llm:
    provider: openai  # or "ollama"
    model_name: gpt-4
    temperature: 0.1
    max_tokens: 4096
    ollama_base_url: http://ollama:11434
    ollama_model: mistral:7b-instruct
  embedding:
    model_name: BAAI/bge-large-en-v1.5
    device: cpu
    batch_size: 32

rag:
  retrieval_k: 5
  score_threshold: 0.5
  chunk_size: 512
  chunk_overlap: 64

sandbox:
  toolbox_image: zerobot-toolbox:latest
  network_disabled: true
  memory_limit: 2g
  cpu_limit: 2.0
  timeout_seconds: 120
  user_id: 1000
  group_id: 1000

docker:
  socket: unix://var/run/docker.sock
  api_version: auto

allowed_hashes:
  # Educational/CTF binaries — add SHA256 hashes here
  # wildcard "*" allows all (use only in dev/test)
  - "*"  # DEVELOPMENT ONLY — remove for production

session:
  idle_timeout_minutes: 60
  max_binary_size_mb: 100

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: /zerobot/logs/zerobot.log
