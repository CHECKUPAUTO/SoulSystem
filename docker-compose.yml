version: '3'

services:
  soulsystem:
    build: .
    ports:
      - "9090:9090"
    volumes:
      - soulsystem_data:/var/lib/soulsystem
      - ./config:/config:ro
    environment:
      - SOULSYSTEM_CONFIG_DIR=/config
      # TELEGRAM_BOT_TOKEN must be set via .env file or export
      # Create a .env file with: TELEGRAM_BOT_TOKEN=your_token_here
    env_file:
      - .env

volumes:
  soulsystem_data:
