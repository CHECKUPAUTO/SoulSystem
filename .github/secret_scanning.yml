# Configuration for GitHub secret scanning.
# https://docs.github.com/en/code-security/secret-scanning/excluding-folders-and-files-from-secret-scanning
#
# The paths below legitimately contain example / fake credential strings that
# are used as detection fixtures, test vectors, or documentation. They are NOT
# real secrets. Excluding them keeps the secret-scanning dashboard focused on
# genuine leaks. Real application source is intentionally NOT excluded.
paths-ignore:
  # `soullink-security` is a secret-detection library. Its source and tests
  # must embed example secret patterns (e.g. AWS's documented example key,
  # fake tokens, PEM headers) as detection fixtures.
  - "soullink-brain/soullink-security/**"

  # Test suites and test-support modules across the workspace use throwaway,
  # obviously-fake credentials.
  - "**/tests/**"
  - "**/testing/**"

  # Documentation that illustrates credential formats (e.g. PEM headers,
  # "sk-..." placeholders) rather than shipping real values.
  - "intel-integrations/soulsystem-integration/docs/**"

  # Example / template environment files (placeholders only).
  - "**/*.env.example"
