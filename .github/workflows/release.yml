name: release

# Build per-platform `soulsystem` binaries and attach them to the GitHub
# Release when a version tag is pushed. These artifacts are what install.sh and
# the npm wrapper download for a fast, no-build install.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build soulsystem
        run: cargo build --release --bin soulsystem --target ${{ matrix.target }}

      - name: Package
        run: |
          bin="soulsystem"
          dist="${bin}-${{ matrix.target }}"
          tar -czf "${dist}.tar.gz" -C "target/${{ matrix.target }}/release" "$bin"
          shasum -a 256 "${dist}.tar.gz" > "${dist}.tar.gz.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            soulsystem-${{ matrix.target }}.tar.gz
            soulsystem-${{ matrix.target }}.tar.gz.sha256
