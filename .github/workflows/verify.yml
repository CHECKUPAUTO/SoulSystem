name: SAI Auto-Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Auto-Verify
        run: |
          set -euo pipefail
          EXIT_CODE=0
          VERIFY_SCRIPT="./skills/auto-verify/verify.sh"

          # Find all files with extensions we can verify
          while IFS= read -r -d '' file; do
            if bash "$VERIFY_SCRIPT" "$file"; then
              echo "✅ PASS: $file"
            else
              echo "❌ FAIL: $file"
              EXIT_CODE=1
            fi
          done < <(find . -type f \( \
            -name "*.py" -o \
            -name "*.js" -o \
            -name "*.ts" -o \
            -name "*.tsx" -o \
            -name "*.sh" -o \
            -name "*.json" -o \
            -name "*.md" \
          \) -not -path "./.git/*" -not -path "./.github/*" -print0)

          if [ $EXIT_CODE -eq 0 ]; then
            echo ""
            echo "✅ All files passed auto-verify"
          else
            echo ""
            echo "❌ Some files failed auto-verify"
          fi
          exit $EXIT_CODE
