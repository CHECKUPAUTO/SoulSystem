name: Temporary Dependabot remediation

on:
  push:
    branches:
      - fix/ci-red-pr169

permissions:
  contents: read

jobs:
  diagnose-rkyv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Identify reverse dependency for vulnerable rkyv
        shell: bash
        run: |
          set -u
          echo '=== cargo tree -i rkyv@0.7.46 ==='
          cargo tree -i rkyv@0.7.46 --workspace
          echo
          echo '=== constrained update probe: rkyv 0.7.46 -> 0.8.17 ==='
          set +e
          cargo update -p rkyv@0.7.46 --precise 0.8.17
          rc=$?
          set -e
          echo "cargo update probe exit code: $rc"
          exit 0
