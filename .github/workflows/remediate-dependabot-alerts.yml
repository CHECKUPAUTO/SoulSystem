name: Temporary Dependabot remediation

on:
  push:
    branches:
      - fix/ci-red-pr169

permissions:
  contents: read

jobs:
  prune-stale-rkyv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Re-resolve rust_decimal and inspect lockfile
        shell: bash
        run: |
          set -euo pipefail
          echo '=== before ==='
          grep -n -A4 -B1 'name = "rkyv"' Cargo.lock || true
          cargo update -p rust_decimal@1.42.1 --precise 1.42.1
          echo
          echo '=== after ==='
          grep -n -A4 -B1 'name = "rkyv"' Cargo.lock || true
          echo
          echo '=== diff ==='
          git diff -- Cargo.lock
          echo
          echo '=== resolved graph check ==='
          if cargo tree --target all | grep -Eq '(^| )rkyv v0\.7\.46([[:space:]]|$)'; then
            echo 'ERROR: vulnerable rkyv is active in the resolved graph'
            exit 1
          fi
