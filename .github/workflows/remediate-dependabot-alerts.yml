name: Temporary Dependabot remediation

on:
  push:
    branches:
      - fix/ci-red-pr169

permissions:
  contents: read

jobs:
  audit-all-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify vulnerable package versions remediated
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib

          forbidden = {
              ("anyhow", "1.0.102"),
              ("crossbeam-epoch", "0.9.18"),
              ("lru", "0.18.0"),
          }
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = []
          for name in tracked:
              if name != "Cargo.lock" and not name.endswith("/Cargo.lock"):
                  continue
              path = Path(name)
              data = tomllib.loads(path.read_text())
              for pkg in data.get("package", []):
                  pair = (pkg.get("name"), pkg.get("version"))
                  if pair in forbidden:
                      bad.append(f"{path}: {pair[0]} {pair[1]}")
          if bad:
              raise SystemExit("vulnerable versions remain:\n" + "\n".join(bad))
          print("Verified: anyhow 1.0.102, crossbeam-epoch 0.9.18, and lru 0.18.0 are absent from all tracked Cargo.lock files")
          PY

      - name: Trace advisory-only lockfile entries
        shell: bash
        run: |
          set -u
          echo '=== rkyv 0.7.46 in resolved all-target graph ==='
          cargo tree -i rkyv@0.7.46 --target all || true
          echo
          echo '=== rsa packages in resolved all-target graph ==='
          cargo tree -i rsa --target all || true

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit every tracked Cargo.lock without stale rustls exceptions
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .cargo/audit.toml ]; then
            mv .cargo/audit.toml /tmp/soulsystem-audit.toml
          fi
          failures=0
          while IFS= read -r lock; do
            echo "::group::cargo audit --file $lock"
            if ! cargo audit --file "$lock" \
              --ignore RUSTSEC-2023-0071 \
              --ignore RUSTSEC-2026-0235; then
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done < <(git ls-files | grep -E '(^|/)Cargo\.lock$')
          if [ "$failures" -ne 0 ]; then
            echo "ERROR: $failures Cargo.lock audit(s) contain additional vulnerabilities"
            exit 1
          fi
