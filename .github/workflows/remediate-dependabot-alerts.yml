name: Temporary Dependabot remediation

on:
  push:
    branches:
      - fix/ci-red-pr169

permissions:
  contents: read

jobs:
  diagnose-rkyv-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Trace rkyv feature activation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== rkyv reverse dependencies, all targets ==='
          cargo tree -i rkyv@0.7.46 --target all
          echo
          echo '=== rust_decimal feature provenance, all targets ==='
          cargo tree -e features -i rust_decimal@1.42.1 --target all
          echo
          echo '=== rkyv feature provenance, all targets ==='
          cargo tree -e features -i rkyv@0.7.46 --target all
