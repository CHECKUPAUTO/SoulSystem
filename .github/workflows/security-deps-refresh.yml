name: Security dependency refresh

on:
  push:
    branches:
      - chore/security-deps-refresh-2026-08-12
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: intel-integrations/soulsystem-integration/docs/architecture-video/package-lock.json
      - name: Refresh Remotion dependency family
        working-directory: intel-integrations/soulsystem-integration/docs/architecture-video
        run: |
          set -euo pipefail
          npm install --save-exact \
            @remotion/cli@4.0.501 \
            @remotion/tailwind-v4@4.0.501 \
            @remotion/transitions@4.0.501 \
            remotion@4.0.501
          npm install --save-dev --save-exact @remotion/eslint-config-flat@4.0.501
          npm audit
          npm run lint
          npm run build
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- \
            intel-integrations/soulsystem-integration/docs/architecture-video/package.json \
            intel-integrations/soulsystem-integration/docs/architecture-video/package-lock.json; then
            echo 'No dependency changes generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            intel-integrations/soulsystem-integration/docs/architecture-video/package.json \
            intel-integrations/soulsystem-integration/docs/architecture-video/package-lock.json
          git commit -m 'chore(deps): refresh Remotion security dependencies'
          git push origin HEAD:chore/security-deps-refresh-2026-08-12
