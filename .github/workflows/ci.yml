name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h /
      - run: sudo apt-get update && sudo apt-get install -y libleptonica-dev libtesseract-dev
      - name: Check workspace (CPU-only)
        run: cargo check --workspace --all-targets
      - name: Check GPU/CUDA sub-workspace
        working-directory: workspaces/gpu
        run: |
          RUSTFLAGS="-D warnings" \\
          cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h /
      - run: sudo apt-get update && sudo apt-get install -y libleptonica-dev libtesseract-dev
      - name: Test workspace (CPU-only)
        run: cargo test --workspace --lib --exclude soulsystem --exclude soul-kernel
      # GPUs may be missing on some runners — skip silently
      - run: cargo test -p soulsystem --tests -- --test-threads=2

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h /
      - run: sudo apt-get update && sudo apt-get install -y libleptonica-dev libtesseract-dev
      - name: Clippy workspace (CPU-only)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy GPU sub-workspace
        working-directory: workspaces/gpu
        run: |
          RUSTFLAGS="-D warnings" \\
          cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
