name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Job 1: Lint + Audit
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    
    - name: Check formatting
      run: cargo fmt --all --check
    
    - name: Clippy
      run: cargo clippy --all-targets
    
    - name: Security audit
      uses: actions-rust-lang/audit@v1
      with:
        denyWarnings: false

  # Job 2: Build + Test (core)
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Check workspace core
      run: cargo check -p soulsystem
    
    - name: Build release
      run: cargo build --release -p soulsystem
    
    - name: Run tests
      run: cargo test -p soulsystem

  # Job 3: Sous-workspaces
  subprojects:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [soul-neural, avid, soullink-node, openevolve, synergie, openclaw-evolution, turboquant, brain-system-rs]
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends libleptonica-dev libtesseract-dev
    
    - name: Check
      run: cargo check --manifest-path ${{ matrix.dir }}/Cargo.toml
    
    - name: Test
      run: cargo test --manifest-path ${{ matrix.dir }}/Cargo.toml
