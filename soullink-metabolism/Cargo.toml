[package]
name = "soullink-metabolism"
version = "0.1.0"
edition = "2021"
description = "SoulLink digital metabolism — energy budget, resource costing, auto-throttle"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "6"
chrono = "0.4"
sysinfo = "0.31"
