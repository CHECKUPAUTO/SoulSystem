[package]
name = "soul_evolution"
version = "0.1.0"
edition = "2021"
description = "Recursive self-improvement engine for agent ecosystems. Implements the AUDIT→ANALYZE→GENERATE→VALIDATE→APPLY→LEARN feedback loop where AI improves AI."
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/OS-AGENTS"
keywords = ["evolution", "genetic-algorithm", "optimization", "scheduler", "adaptation"]
categories = ["algorithms", "machine-learning", "embedded"]

[[bin]]
name = "aevolve"
path = "src/main.rs"

[dependencies]
libc = "0.2.155"
soul_scheduler = { path = "../soul_scheduler" }
soul_orchestrator = { path = "../soul_orchestrator" }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { workspace = true }
walkdir = "2"
fastrand = "2"
