[workspace]
resolver = "2"
members = [
    "soulsystem-gepa",
    "soulsystem-multiagent",
    "soulsystem-memory-extract",
    "openclaw-u",
    "soullink-brain/soullink-core",
    "soullink-brain/soullink-nvml",
    "soullink-brain/soullink-guardian",
    "soullink-brain/soullink-orchestrator",
    "soullink-brain/soullink-decision-v13",
    "soullink-brain/soullink-gateway",
    "soullink-brain/soullink-benches",
    "soullink-brain/soullink-simd",
    "soullink-brain/soullink-vector",
    "soullink-brain/soullink-memory",
    "soullink-brain/soullink-workflow",
    "soullink-brain/soullink-crypto-bridge",
    "soullink-brain/soullink-portfolio",
    "soullink-brain/soullink-security",
    "soullink-brain/soullink-eval",
    "soullink-brain/soullink-bus",
    "soullink-brain/soullink-actions",
    "soullink-brain/soullink-senate",
    "soullink-brain/soullink-reasoning",
    "soullink-brain/soullink-vision",
    "soullink-brain/soullink-autonomy",
    "soullink-brain/soullink-inference",
    "soullink-brain/soullink-proxy",
    "soullink-brain/soullink-trt",
    "soullink-brain/soullink-rag",
    "soullink-brain/soullink-dali",
    "soullink-brain/soullink-cutlass",
    "soullink-brain/soullink-cli",
    "soullink-brain/soullink-svs",
    "soullink-brain/soullink-onednn",
    "soullink-brain/soullink-secrets",
    "soullink-brain/soullink-hooks",
    "soullink-brain/soullink-allowlist",
    "soullink-brain/soullink-gate",
    "soullink-brain/soullink-circuit",
    "soullink-brain/soullink-routing",
    "soullink-brain/soullink-wasm-organ",
    "soullink-brain/soullink-gbrain",
    "soullink-organs",
    "avid-soullink",
    "avid-rstdp",
    "avid-anticlone-service",
    "scirust-trading-core",
    "scirust-trading-engine",
    "scirust-trading-observer",
    "scirust-trading-persistence",
    "scirust-trading-news",
    "scirust-trading-monitor",
    "scirust-simd",
    "scirust-gpu",
    "soullink-metabolism",
    "bound-system",
    "brain-system-rs",
    "openclaw-evolution",
    "synergie",
    "soullink-orchestrator-standalone",
    "openevolve",
]

exclude = [
    "soul-neural",
    "avid",
    "soullink-node",
    "turboquant",
    "avid-bridge",
    "synergie-bridge",
    "openevolve-bridge",
    "brain-bridge",
    "soul-neural-bridge",
]

[workspace.package]
version = "13.5.0"
edition = "2021"
rust-version = "1.75"
authors = ["SoulLink Mesh Team"]
license = "MIT"
repository = "internal"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "process", "fs", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
arc-swap = "1.7"
dashmap = "5.5"
parking_lot = "0.12"
ahash = "0.8"
metrics = "0.22"
metrics-exporter-prometheus = { version = "0.13", default-features = false, features = ["http-listener"] }
async-trait = "0.1"
subtle = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
rmp-serde = "1.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
wiremock = "0.6"
criterion = { version = "0.5", default-features = false, features = ["async_tokio", "html_reports"] }
axum = { version = "0.7", default-features = false, features = ["http1", "http2", "json", "tokio", "tower-log"] }
tower = { version = "0.4", default-features = false, features = ["util"] }
tower-http = { version = "0.5", default-features = false, features = ["trace", "cors", "limit"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
nvml-wrapper = { version = "0.9", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
regex = "1.10"
thiserror = "1"
anyhow = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
# local workspace crates
ansi-converter = { path = "ansi-converter" }
bus = { path = "bus" }
bound-system = { path = "bound-system" }
clawd = { path = "clawd" }
local-skills = { path = "local-skills" }
model-router = { path = "model-router" }
pty-terminal = { path = "pty-terminal" }
soul-memory = { path = "soul-memory" }
spinner = { path = "spinner" }
terminal-stream = { path = "terminal-stream" }
scirust-autodiff = { path = "scirust-autodiff" }
scirust-core = { path = "scirust-core" }

# external crates referenced as workspace deps

[package]
name = "soulsystem"
version = "0.6.0"
edition = "2021"
description = "SoulSystem — Écosystème d'agent numérique autonome"
license = "MIT OR Apache-2.0"

[dependencies]
bus = { workspace = true }
soul-memory = { workspace = true }
bound-system = { workspace = true }
clawd = { workspace = true }
ansi-converter = { workspace = true }
terminal-stream = { workspace = true }
pty-terminal = { workspace = true }
local-skills = { workspace = true }
model-router = { workspace = true }
spinner = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "process", "fs", "sync", "signal"] }
toml = "0.8"
sled = "0.34"
seahash = "4.1"
chrono = "0.4"
sha2 = "0.10"
hostname = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
regex = "1"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
which = "8"
sysinfo = "0.31"
clap = { version = "4", features = ["derive"] }
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", features = ["json"] }
teloxide = { version = "0.13", features = ["macros", "ctrlc_handler"] }
axum = "0.7"
soullink-memory = { path = "soullink-brain/soullink-memory",  }
soullink-rag = { path = "soullink-brain/soullink-rag",  }
soullink-autonomy = { path = "soullink-brain/soullink-autonomy" }

# Ponts d'intégration optionnels
avid-bridge = { path = "avid-bridge", optional = true }
synergie-bridge = { path = "synergie-bridge", optional = true }
openevolve-bridge = { path = "openevolve-bridge", optional = true }
brain-bridge = { path = "brain-bridge", optional = true }
soul-neural-bridge = { path = "soul-neural-bridge", optional = true }

portable-pty = "0.8"
libc = "0.2"
tempfile = "3"
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"

[features]
dev = []
gpu = []
avid = ["avid-bridge"]
synergie = ["synergie-bridge"]
openevolve = ["openevolve-bridge"]
brain_system = ["brain-bridge"]
soul_neural = ["soul-neural-bridge"]
default = []
