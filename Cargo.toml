[workspace.package]
version = "13.5.0"
edition = "2021"
rust-version = "1.85"
authors = ["SoulLink Mesh Team"]
license = "MIT"
repository = "internal"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "process", "fs", "sync", "signal", "net", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
arc-swap = "1.7"
dashmap = "6"
parking_lot = "0.12"
ahash = "0.8"
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false, features = ["http-listener"] }
async-trait = "0.1"
subtle = "2.5"
zeroize = "1.8"
colored = "3"
crossterm = "0.29"
cudarc = "0.13"
dirs = "6"
half = "2"
lazy_static = "1"
log = "0.4"
ndarray = "0.16"
prometheus = "0.13"
ratatui = "0.30"
scirust-gpu = { path = "scirust-gpu" }
uuid = { version = "1", features = ["v4", "serde"] }
rmp-serde = "1.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
wiremock = "0.6"
criterion = { version = "0.5", default-features = false, features = ["async_tokio", "html_reports"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio", "tower-log"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["trace", "cors", "limit", "set-header"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
nvml-wrapper = { version = "0.9", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
toml = "0.8"
regex = "1.10"
thiserror = "2"
anyhow = "1"
rand = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive"] }
# local workspace crates
ansi-converter = { path = "ansi-converter" }
bus = { path = "bus" }
bound-system = { path = "bound-system" }
clawd = { path = "clawd" }
local-skills = { path = "local-skills" }
model-router = { path = "model-router" }
pty-terminal = { path = "pty-terminal" }
soul-memory = { path = "soul-memory" }
soul-bridge = { path = "soul-bridge" }
spinner = { path = "spinner" }
terminal-stream = { path = "terminal-stream" }
scirust-autodiff = { path = "scirust-autodiff" }
scirust-core = { path = "scirust-core" }
soulsystem-common = { path = "crates/soulsystem-common" }

# external crates referenced as workspace deps

[package]
name = "soulsystem"
version = "0.6.0"
edition = "2021"
description = "SoulSystem — Autonomous digital agent ecosystem"
license = "MIT OR Apache-2.0"

[dependencies]
bus = { workspace = true }
soul-bridge = { workspace = true }
soul-memory = { workspace = true }
soulsystem-common = { workspace = true }
bound-system = { workspace = true }
clawd = { workspace = true }
ansi-converter = { workspace = true }
terminal-stream = { workspace = true }
pty-terminal = { workspace = true }
local-skills = { workspace = true }
model-router = { workspace = true }
spinner = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
sled = "0.34"
seahash = "4.1"
chrono = { workspace = true }
sha2 = "0.10"
hostname = "0.4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
rand = "0.8"
ed25519-dalek = { version = "2", optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
which = "8"
sysinfo = "0.31"
clap = { workspace = true }
tar = "0.4"
flate2 = "1"
reqwest = { workspace = true }
teloxide = { version = "0.13", features = ["macros", "ctrlc_handler"] }
axum = { workspace = true }
soullink-memory = { path = "soullink-brain/soullink-memory" }
soullink-rag = { path = "soullink-brain/soullink-rag" }
soullink-autonomy = { path = "soullink-brain/soullink-autonomy" }
soullink-circuit = { path = "soullink-brain/soullink-circuit" }

# Ponts d'intégration (unified)

portable-pty = "0.8"
libc = "0.2"
tempfile = { workspace = true }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"

# Autonomous entity crates
soul_llm = { path = "soul_llm" }
soul_agent_core = { path = "soul-agent-core" }
soul_planner = { path = "soul_planner" }
soul_tools = { path = "soul_tools" }
soul_repl = { path = "soul_repl" }
soul_daemon = { path = "soul-daemon" }
soul_sandbox = { path = "soul_sandbox" }
soul_browser = { path = "soul-browser" }
soul_subagents = { path = "soul-subagents" }
soul_goaltree = { path = "soul-goaltree" }
soul_automodify = { path = "soul-automodify" }
soul_eventbus = { path = "soul-eventbus" }
soul-dashboard = { path = "crates/soul-dashboard" }
soul_mcp = { path = "soul-mcp" }
soul_skills = { path = "soul-skills" }
soul_compaction = { path = "soul-compaction" }
soul_protocol = { path = "soul-protocol" }
soul_wasm = { path = "soul-wasm" }
soul_designtree = { path = "soul-designtree" }
soul_inference = { path = "soul-inference" }
soul_critique = { path = "soul-critique" }
soul_scheduler = { path = "soul-scheduler" }
uuid = { version = "1", features = ["v4"] }
rustyline = "14"
colored = "2"

[features]
dev = []
gpu = []
ed25519 = ["dep:ed25519-dalek"]
default = ["ed25519"]
# Optional bridge integrations (gate `soul_bridge::*` wiring in src/).
avid = []
brain_system = []
mesh = []
openevolve = []
organs = []
services = []
soul_neural = []
synergie = []

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[workspace.lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused_mut = "allow"
unused_assignments = "allow"
unused_unsafe = "allow"
unused_comparisons = "allow"
unreachable_pub = "allow"
non_camel_case_types = "allow"
non_snake_case = "allow"
deprecated = "allow"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(blas)', 'cfg(rayon)'] }
missing_docs = "allow"

[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256
