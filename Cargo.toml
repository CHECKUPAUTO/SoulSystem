[workspace]
members = [
    "scirust_affective_core",
    "semantic_neuromodulator",
    "neural_metacognition",
    "ecosystem_synapse_linker",
    "neural_clinical_console",
    "semantic_firewall",
    "neural_cluster_sync",
    "neural_graph_compiler",
    "neural_chaos_monkey",
    "ontological_self_healing",
    "soul_scheduler",
    "soul_matrix_engine",
    "soul_storage",
    "soul_ipc",
    "soul_evolution",
    "soul_agent_runtime",
    "soul_telemetry",
    "soul_journal",
    "soul_forge",
    "soul_orchestrator",

    "soul_llm",
    "soul_planner",
    "soul_tools",
    "soul_repl",
    "soul_persistence",
    "soul_sandbox",
    "soul_gateway",
    "soul_openclaw",
    "soul_entity",
    "souls",
    "test_telemetry",
]
resolver = "2"

[workspace.dependencies]
serde = { workspace = true }
serde_json = "1"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "process", "fs", "sync", "signal", "net", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { workspace = true }
tempfile = "3"
arc-swap = "1.7"
dashmap = "6"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
uuid = "1"
thiserror = "1"
async-trait = "0.1"
lazy_static = "1.4"
prometheus = "0.13"
anyhow = "1"
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
colored = "3"
dirs = "6"
futures = "0.3"
dashmap = "6"
reqwest = { version = "0.12", features = ["json", "stream"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[workspace.lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused_mut = "allow"
unused_assignments = "allow"
unused_unsafe = "allow"
unused_comparisons = "allow"
unreachable_pub = "allow"
non_camel_case_types = "allow"
non_snake_case = "allow"
deprecated = "allow"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(blas)', 'cfg(rayon)'] }
missing_docs = "allow"

[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256
