[workspace]
resolver = "2"
members = [
    "openclaw-u",
    "soulsystem-gepa",
    "soulsystem-multiagent",
    "soulsystem-memory-extract",
]

[workspace.package]
version = "13.5.0"
edition = "2021"
rust-version = "1.75"
authors = ["SoulLink Mesh Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "signal", "time", "net", "process", "fs", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "ansi"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "gzip", "stream"] }
tempfile = "3.10"
