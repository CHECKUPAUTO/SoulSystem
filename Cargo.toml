[workspace]
resolver = "2"
members = [
    "soulsystem-gepa",
    "soulsystem-multiagent",
    "soulsystem-memory-extract",
    "openclaw-u",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
authors = ["OpenClaw-U System"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "process", "fs", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"

[package]
name = "soulsystem"
version = "0.5.0"
edition = "2021"
description = "SoulSystem — Écosystème d'agent numérique autonome"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "process", "fs", "sync", "signal"] }
toml = "0.8"
sled = "0.34"
seahash = "4.1"
chrono = "0.4"
sha2 = "0.10"
hostname = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
regex = "1"
rand = "0.8"
which = "8"
sysinfo = "0.31"
clap = { version = "4", features = ["derive"] }
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", features = ["json"] }
teloxide = { version = "0.13", features = ["macros", "ctrlc_handler"] }
axum = "0.7"

# backlog — kept for reference but not active
# serde_yaml, uuid, hex, ring, libloading

portable-pty = "0.8"
libc = "0.2"
tempfile = "3"
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"

[features]
dev = []
gpu = []

[dependencies.tokio-stream]
version = "0.1"
features = ["sync"]
