exclude = [
    "soul-neural",
    "avid",
    "soullink-node",
    "turboquant",
]

[workspace.package]
version = "13.5.0"
edition = "2021"
rust-version = "1.75"
authors = ["SoulLink Mesh Team"]
license = "MIT"
repository = "internal"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "process", "fs", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
arc-swap = "1.7"
dashmap = "6"
parking_lot = "0.12"
ahash = "0.8"
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false, features = ["http-listener"] }
async-trait = "0.1"
subtle = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
rmp-serde = "1.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
wiremock = "0.6"
criterion = { version = "0.5", default-features = false, features = ["async_tokio", "html_reports"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio", "tower-log"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["trace", "cors", "limit"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
nvml-wrapper = { version = "0.9", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
toml = "0.8"
regex = "1.10"
thiserror = "2"
anyhow = "1"
rand = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive"] }
# local workspace crates
ansi-converter = { path = "ansi-converter" }
bus = { path = "bus" }
bound-system = { path = "bound-system" }
clawd = { path = "clawd" }
local-skills = { path = "local-skills" }
model-router = { path = "model-router" }
pty-terminal = { path = "pty-terminal" }
soul-memory = { path = "soul-memory" }
spinner = { path = "spinner" }
terminal-stream = { path = "terminal-stream" }
scirust-autodiff = { path = "scirust-autodiff" }
scirust-core = { path = "scirust-core" }
soulsystem-common = { path = "crates/soulsystem-common" }

# external crates referenced as workspace deps

[package]
name = "soulsystem"
version = "0.6.0"
edition = "2021"
description = "SoulSystem — Écosystème d'agent numérique autonome"
license = "MIT OR Apache-2.0"

[dependencies]
bus = { workspace = true }
soul-memory = { workspace = true }
soulsystem-common = { workspace = true }
bound-system = { workspace = true }
clawd = { workspace = true }
ansi-converter = { workspace = true }
terminal-stream = { workspace = true }
pty-terminal = { workspace = true }
local-skills = { workspace = true }
model-router = { workspace = true }
spinner = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
sled = "0.34"
seahash = "4.1"
chrono = { workspace = true }
sha2 = "0.10"
hostname = "0.4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
which = "8"
sysinfo = "0.31"
clap = { workspace = true }
tar = "0.4"
flate2 = "1"
reqwest = { workspace = true }
teloxide = { version = "0.13", features = ["macros", "ctrlc_handler"] }
axum = { workspace = true }
soullink-memory = { path = "soullink-brain/soullink-memory" }
soullink-rag = { path = "soullink-brain/soullink-rag" }
soullink-autonomy = { path = "soullink-brain/soullink-autonomy" }
soullink-circuit = { path = "soullink-brain/soullink-circuit" }

# Ponts d'intégration optionnels
avid-bridge = { path = "avid-bridge", optional = true }
synergie-bridge = { path = "synergie-bridge", optional = true }
openevolve-bridge = { path = "openevolve-bridge", optional = true }
brain-bridge = { path = "brain-bridge", optional = true }
soul-neural-bridge = { path = "soul-neural-bridge", optional = true }
organs-bridge = { path = "organs-bridge", optional = true }
mesh-bridge = { path = "mesh-bridge", optional = true }
services-bridge = { path = "services-bridge", optional = true }

portable-pty = "0.8"
libc = "0.2"
tempfile = { workspace = true }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"

# Autonomous entity crates
soul_llm = { path = "soul_llm" }
soul_planner = { path = "soul_planner" }
soul_tools = { path = "soul_tools" }
soul_repl = { path = "soul_repl" }
soul_bridges = { path = "soul_bridges" }
soul_cognitive = { path = "soul_cognitive" }
soul_automation = { path = "soul_automation" }
soul_security = { path = "soul_security" }
soul_monitor = { path = "soul_monitor" }
soul_api = { path = "soul_api" }
uuid = { version = "1", features = ["v4"] }
rustyline = "14"
colored = "2"

[features]
dev = []
gpu = []
avid = ["avid-bridge"]
synergie = ["synergie-bridge"]
openevolve = ["openevolve-bridge"]
brain_system = ["brain-bridge"]
soul_neural = ["soul-neural-bridge"]
organs = ["organs-bridge"]
mesh = ["mesh-bridge"]
services = ["services-bridge"]
default = []

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
