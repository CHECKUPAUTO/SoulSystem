[package]
name = "openclaw-u"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["OpenClaw-U System"]
description = "OpenClaw-U — Autonomous Agent Kernel"

[dependencies]
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "process", "fs", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
axum = "0.7"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }

[[bin]]
name = "openclaw-u"
path = "src/main.rs"
