[workspace]

[package]
name = "openclaw-u"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["OpenClaw-U System"]
description = "OpenClaw-U — Autonomous Agent Kernel"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "fs", "sync", "signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
regex = "1"
axum = "0.7"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
soullink-security = { path = "../soullink-brain/soullink-security" }

[lib]
name = "openclaw_u"
path = "src/lib.rs"

[[bin]]
name = "openclaw-u"
path = "src/main.rs"
