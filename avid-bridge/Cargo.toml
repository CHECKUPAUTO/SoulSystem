[package]
name = "avid-bridge"
version = "0.1.0"
edition = "2021"
description = "Pont d'intégration AVID ↔ SoulSystem"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
default = []
avid = []