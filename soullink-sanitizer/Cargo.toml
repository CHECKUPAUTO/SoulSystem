[package]
name = "soullink-sanitizer"
version = "0.1.0"
edition = "2021"
description = "7-layer content sanitizer for prompt injection defense — ported from AlexClaw Elixir pattern. Hidden HTML detection, zero-width Unicode stripping, imperative tone heuristic, 101+ injection patterns."

[dependencies]
regex = "1"
scraper = "0.20"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

[dev-dependencies]
