[package]
name = "soulsystem-memory-extract"
version = "0.2.0"
edition = "2021"
description = "Post-session extraction: facts → MEMORY.md, patterns → wiki/"

[dependencies]
regex = "1"
lazy_static = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
once_cell = "1"
confy = "0.6"
tokio = { version = "1", features = ["full"] }
