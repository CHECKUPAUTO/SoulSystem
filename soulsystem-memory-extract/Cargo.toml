[package]
name = "soulsystem-memory-extract"
version = "0.1.0"
edition = "2021"
description = "Post-session extraction: facts → MEMORY.md, patterns → wiki/"
[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
