[package]
name = "soul_automodify"
version = "0.1.0"
edition = "2021"
description = "Self-code modification with backup and rollback"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
tracing = "0.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
diff = "0.1"

[dev-dependencies]
tempfile = "3"
