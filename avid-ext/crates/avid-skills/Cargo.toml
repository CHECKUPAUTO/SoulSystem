[package]
name = "avid-skills"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Skill system for AVID — load, register, and execute SKILL.md-based agent skills"
repository = "https://github.com/CHECKUPAUTO/AVID"
documentation = "https://docs.rs/avid-skills"
keywords = ["llm", "agent", "skill", "orchestrator"]
categories = ["development-tools"]

[dependencies]
avid-core = { path = "../avid-core" }

serde = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { workspace = true }
tracing = "0"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
