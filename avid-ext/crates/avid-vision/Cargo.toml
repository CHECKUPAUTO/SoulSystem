[package]
name = "avid-vision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pattern recognition engine for the AVID autonomous system"

[dependencies]
avid-core = { path = "../avid-core" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "full"] }
tracing = "0"
garde = { version = "0", features = ["derive"] }
async-trait = "0.1"
ort = "2.0.0-rc.12"
image = "0.25"
tesseract = "0.15"
lru = "0.12"
chromiumoxide = { version = "0.7", features = ["async-std-runtime"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
