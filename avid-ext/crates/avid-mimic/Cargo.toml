[package]
name = "avid-mimic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Intelligent cloning engine for the AVID autonomous system"

[dependencies]
serde_json = "1"
rustpython-parser = "0.4"
avid-core = { path = "../avid-core" }
thiserror = "2"
anyhow = "1"
serde = { workspace = true }
tokio = { workspace = true }
tracing = "0"
garde = { version = "0", features = ["derive"] }
async-trait = "0.1"
chromiumoxide = { version = "0.7", features = ["async-std-runtime"] }
thirtyfour = "0.34"
chrono = { workspace = true }
futures = "0.3"
