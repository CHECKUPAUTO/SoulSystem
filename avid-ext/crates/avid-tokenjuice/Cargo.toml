[package]
name = "avid-tokenjuice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Token counting, budgeting, and middleware for LLM calls in the AVID system"
repository = "https://github.com/CHECKUPAUTO/AVID"
documentation = "https://docs.rs/avid-tokenjuice"
keywords = ["token", "llm", "budget", "ollama"]
categories = ["development-tools"]

[dependencies]
avid-core = { path = "../avid-core" }

tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
garde = { version = "0.20", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
