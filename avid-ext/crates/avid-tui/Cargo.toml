[package]
name = "avid-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
color-eyre = "0.6"
throbber-widgets-tui = "0.8"
tui-input = "0.11"
avid-core = { path = "../avid-core" }
