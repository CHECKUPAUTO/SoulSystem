name: Extras CI (non-blocking)

# Builds the "extras" crates that live outside the main workspace.
# A failure in this workflow does NOT block PRs to main — it's
# informational. The goal is to keep the core pipeline (avid-core,
# avid-orchestrator, avid-server, …) immune to regressions in the
# autonomous side-modules (cobalt, hnn, intel, security, gomogo).

on:
  push:
    branches: [main]
    paths:
      - 'crates/avid-cobalt/**'
      - 'crates/avid-hnn/**'
      - 'crates/avid-intel/**'
      - 'crates/avid-security/**'
      - 'crates/avid-gomogo/**'
      - '.github/workflows/extras.yml'
  pull_request:
    paths:
      - 'crates/avid-cobalt/**'
      - 'crates/avid-hnn/**'
      - 'crates/avid-intel/**'
      - 'crates/avid-security/**'
      - 'crates/avid-gomogo/**'

# Important : these jobs are not required for merge.
# Set "Settings → Branches → Branch protection rules" to:
#   - Required status checks: only the core CI jobs
#   - Do NOT add any extras-* job to the required list

jobs:
  extras-matrix:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    continue-on-error: true   # informational only
    strategy:
      fail-fast: false        # one crate failing doesn't cancel the others
      matrix:
        include:
          - crate: avid-cobalt
            features: ""
          - crate: avid-gomogo
            features: ""
          - crate: avid-hnn
            features: ""        # default = scirust off, should compile
          - crate: avid-intel
            features: ""
          - crate: avid-security
            features: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/${{ matrix.crate }}"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev libleptonica-dev libtesseract-dev libclang-dev

      - name: Check
        run: |
          cd crates/${{ matrix.crate }}
          if [ -n "${{ matrix.features }}" ]; then
            cargo check --features "${{ matrix.features }}"
          else
            cargo check
          fi

      - name: Clippy (no -D warnings — extras are looser)
        run: |
          cd crates/${{ matrix.crate }}
          cargo clippy --no-deps -- -W clippy::all

      - name: Test
        run: |
          cd crates/${{ matrix.crate }}
          cargo test --lib

  extras-aggregate-report:
    name: Aggregate report
    runs-on: ubuntu-latest
    needs: extras-matrix
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Extras CI completed. Failures are informational and do NOT block merges to main."
          echo "If you depend on an extras crate, build it explicitly with:"
          echo "  cargo build --manifest-path crates/<crate>/Cargo.toml"
