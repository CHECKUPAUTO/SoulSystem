name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE-*', '.env.example']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        toolchain: ["1.88", "stable"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Override toolchain
        run: rustup override set ${{ matrix.toolchain }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3 libtesseract-dev libleptonica-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

  no-orphan-files:
    name: No orphan .rs files
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Detect orphans
        run: |
          set -euo pipefail
          orphans=$(bash scripts/find_orphan_modules.sh)
          if [ -n "$orphans" ]; then
            echo "::error::Orphan .rs files detected (not declared via mod xxx;):"
            echo "$orphans"
            exit 1
          fi
          echo "No orphan files."

  release-check:
    name: Release build check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Override toolchain
        run: rustup override set stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3 libtesseract-dev libleptonica-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build release
        run: cargo build --release --workspace

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: avid-server-release
          path: target/release/avid-server
          retention-days: 7

  no-jules-allow-blocks:
    name: No giant allow-blocks (Jules contract rule 4)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check allow blocks on added/modified Rust files
        run: |
          set -euo pipefail
          files=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref || 'main' }}...HEAD 2>/dev/null | grep '\.rs$' || true)
          if [ -z "$files" ]; then
            echo "No Rust files changed — skipping."
            exit 0
          fi
          violations=0
          for f in $files; do
            [ -f "$f" ] || continue
            lines=$(awk '/^#![allow\(/,/^\)\]/{count++} END{print count}' "$f")
            if [ "${lines:-0}" -gt 6 ]; then
              echo "::error file=$f::JULES_CONTRACT rule 4: $lines lines of #![allow(...)] (max 5 lints)"
              violations=$((violations + 1))
            fi
          done
          if [ "$violations" -gt 0 ]; then
            echo "Total violations: $violations"
            exit 1
          fi
          echo "All files pass rule 4."

  no-absolute-paths:
    name: No absolute paths in Cargo.toml (Jules contract rule 7)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Grep Cargo.toml for absolute path = "/..."
        run: |
          set -euo pipefail
          matches=$(grep -rn 'path = "/' crates/*/Cargo.toml 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::JULES_CONTRACT rule 7: absolute paths in Cargo.toml"
            echo "$matches"
            exit 1
          fi
          echo "No absolute paths found."

  boilerplate-detector:
    name: Detect AI boilerplate
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build anticlone
        run: cargo build --release -p avid-anticlone
      - name: Score new files
        run: |
          new_files=$(git diff --name-only --diff-filter=A origin/main...HEAD | grep '\.rs$' || true)
          [ -z "$new_files" ] && exit 0
          for f in $new_files; do
            lines=$(wc -l < "$f")
            echo "::notice file=$f::New file with $lines lines — manual review required"
          done
