iterations: 50
language: python
llm:
  generation:
    provider: ollama
    base_url: http://localhost:11434
    api_key: null
    model: qwen3-coder-next:cloud
    temperature: 0.8
    max_tokens: 4096
    timeout_secs: 120
    retries: 3
    retry_delay_ms: 500
  feedback:
    provider: ollama
    base_url: http://localhost:11434
    api_key: null
    model: glm-5:cloud
    temperature: 0.7
    max_tokens: 2048
    timeout_secs: 120
    retries: 3
    retry_delay_ms: 500
evolution:
  num_islands: 2
  population_per_island: 5
  migration_interval: 20
  migration_count: 1
  elite_ratio: 0.2
  parallel_evaluations: 4
  crossover_rate: 0.3
  mutation_rate: 0.7
  diversity_weight: 0.1
  checkpoint_interval: 25
  temperature_decay: 0.995
  convergence_patience: 50
  convergence_delta: 0.001
  static_analysis_enabled: false
  max_cyclomatic_complexity: 20
  max_nesting_depth: 5
  analysis_weight: 0.1
evaluator:
  timeout_secs: 60
  python_bin: python3
  validate_before_run: true
  max_output_bytes: 1048576
sandbox:
  mode: docker
  memory_mb: 512
  cpu_limit: 1.0
  timeout_secs: 60
  network_enabled: false
  max_output_bytes: 1048576
  python_image: python:3.12-slim
  rust_image: rust:1.80-slim
  node_image: node:20-slim
logging:
  file_enabled: true
  dir: logs
  level: info
prompts_dir: prompts
