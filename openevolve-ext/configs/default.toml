# OpenEvolve — default config

[evolution]
max_iterations      = 200
quick_iterations    = 50
checkpoint_interval = 10
log_level           = "info"

[llm]
primary_model    = "qwen3-coder-next:cloud"
secondary_model  = "glm-5:cloud"
primary_weight   = 0.65
api_base         = "http://localhost:11434/api"
temperature      = 0.8
max_tokens       = 4096
timeout_secs     = 120

[database]
population_size    = 100
num_islands        = 4
migration_interval = 20
elite_fraction     = 0.10
output_dir         = "openevolve_output"

[evaluator]
evaluator_bin = "./examples/my_task/target/release/evaluator"
timeout_secs  = 30
sandbox       = true
