[package]
name = "soul-neural-bridge"
version = "0.1.0"
edition = "2021"
description = "Pont SoulNeural ↔ SoulSystem — vue unifiée HNN + orchestrateur"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
soul-core = { path = "/root/SoulSystem/soul-neural/crates/soul-core", optional = true }
soul-hnn = { path = "/root/SoulSystem/soul-neural/crates/soul-hnn", optional = true }
soul-cortex = { path = "/root/SoulSystem/soul-neural/crates/soul-cortex", optional = true }
soul-minillm = { path = "/root/SoulSystem/soul-neural/crates/soul-minillm", optional = true }

[features]
default = []
soul_neural = ["dep:soul-core", "dep:soul-hnn", "dep:soul-cortex", "dep:soul-minillm"]
