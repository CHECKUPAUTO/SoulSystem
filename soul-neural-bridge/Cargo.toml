[package]
name = "soul-neural-bridge"
version = "0.1.0"
edition = "2021"
description = "Pont SoulNeural ↔ SoulSystem — vue unifiée HNN + orchestrateur"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
soul-core = { path = "../soul-neural/crates/soul-core", optional = true }
soul-hnn = { path = "../soul-neural/crates/soul-hnn", optional = true }
soul-cortex = { path = "../soul-neural/crates/soul-cortex", optional = true }
soul-minillm = { path = "../soul-neural/crates/soul-minillm", optional = true }

[features]
default = []
soul_neural = ["dep:soul-core", "dep:soul-hnn", "dep:soul-cortex", "dep:soul-minillm"]
