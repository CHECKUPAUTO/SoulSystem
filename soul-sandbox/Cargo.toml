[package]
name = "soul_sandbox"
version = "0.2.0"
edition = "2021"
description = "Sandboxed command execution with resource limits, seccomp, and isolation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
tracing = "0.1"
thiserror = "2"
nix = { version = "0.29", features = ["sched", "resource", "fs", "process"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
