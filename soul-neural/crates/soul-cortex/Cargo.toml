[package]
name = "soul-cortex"
version.workspace = true
edition.workspace = true
description = "Cortex — fusion HNN/LLM with symplectic bias"

[dependencies]
soul-core = { path = "../soul-core" }
soul-hnn = { path = "../soul-hnn" }
soul-minillm = { path = "../soul-minillm" }
soul-embed = { path = "../soul-embed" }
lazy_static = "1"
ndarray = "0.15"
once_cell = "1"
prometheus = { version = "0.13", features = ["process"] }
log = "0.4"
tokio = { workspace = true }
serde = { workspace = true }
anyhow = "1"

[lib]
name = "soul_cortex"
path = "src/lib.rs"
