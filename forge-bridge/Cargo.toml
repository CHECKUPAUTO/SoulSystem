[package]
name = "forge-bridge"
version = "0.1.0"
edition = "2021"
description = "Pont Forge (moteur évolutionnaire) ↔ SoulSystem — vue fonctionnelle du moteur"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
forge-core = { path = "/root/forge/forge/forge-core" }
rand = "0.8"

[features]
default = []
llm = []
