version: "3.8"

services:
  soulsystem-evo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soulsystem-evolution
    restart: unless-stopped
    network_mode: host

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      - soulsystem-data:/opt/soulsystem/data
      - soulsystem-logs:/opt/soulsystem/logs

    env_file:
      - .env

    healthcheck:
      test: ["CMD", "pgrep", "-f", "soulsystem"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  soulsystem-data:
    driver: local
  soulsystem-logs:
    driver: local
