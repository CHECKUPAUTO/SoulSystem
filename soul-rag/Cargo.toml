[package]
name = "soul_rag"
version = "0.1.0"
edition = "2021"
description = "RAG integration combining web fetch, browser, and memory"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
thiserror = "2"
soul_webfetch = { path = "../soul-webfetch" }
soul_browser = { path = "../soul-browser" }
soul_persist = { path = "../soul-persist" }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
