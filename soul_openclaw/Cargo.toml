[package]
name = "soul_openclaw"
version = "0.1.0"
edition = "2021"
description = "OpenClaw (openclaw.ai) bridge providing agent loop, skill registry, and memory host integration for SoulSystem"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/OS-AGENTS"
keywords = ["opencawl", "bridge", "agent-loop", "skills", "memory", "registry", "integration"]
categories = ["machine-learning", "embedded", "api"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4"] }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
