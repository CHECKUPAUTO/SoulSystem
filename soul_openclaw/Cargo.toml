[package]
name = "soul_openclaw"
version = "0.1.0"
edition = "2021"
description = "Bridge conceptuel vers openclaw (openclaw.ai) : agent loop, skills, memory host"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
