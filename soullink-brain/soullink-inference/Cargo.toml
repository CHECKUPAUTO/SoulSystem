[package]
name = "soullink-inference"
version = "0.1.0"
edition = "2021"
description = "NUMA-aware inference engine for SoulLink V13.5"

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
num_cpus = "1"
reqwest = { version = "0.12", features = ["json"] }
libc = "0.2"

# Workspace crates
soullink-nvml = { path = "../soullink-nvml" }

# llama.cpp bindings for direct GPU inference + KV cache control
llama-cpp-2 = { version = "0.1", optional = true }

# TurboQuant: PolarQuant + QJL 3-bit KV cache compression
nalgebra = "0.33"
rand = "0.8"
rand_distr = "0.4"

# HTTP proxy server
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing-subscriber = "0.3"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
llama-cpp = ["llama-cpp-2"]