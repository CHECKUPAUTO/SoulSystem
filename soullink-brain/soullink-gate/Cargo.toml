[package]
name = "soullink-gate"
version = "0.1.0"
edition = "2021"
description = "Approval gate for tool execution with persistent permissions (IronClaw-inspired)"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "fs"] }
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
