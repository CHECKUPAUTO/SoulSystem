[package]
name = "soullink-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SoulLink V13.5 memory graph — concept storage, semantic search, temporal decay"

[dependencies]
soullink-core = { path = "../soullink-core" }
soullink-vector = { path = "../soullink-vector" }
soullink-simd = { path = "../soullink-simd" }
soulsystem-common = { path = "../../crates/soulsystem-common" }

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dashmap = { workspace = true }
parking_lot = { workspace = true }
petgraph = "0.7"
sled = "0.34"
bincode = "1.3"
reqwest = { workspace = true }
rayon = "1.10"
