[package]
name = "soullink-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Messaging gateway for SoulLink — routes Telegram/WhatsApp messages to/from the orchestrator"

[dependencies]
soullink-core = { path = "../soullink-core" }
# Learned cost-aware routing (no default features → no heavy avid-core tree).
avid-model-router = { path = "../../avid/crates/avid-model-router", default-features = false }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
toml = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
colored = "2"
axum = { workspace = true, features = ["ws", "query"] }
uuid = { workspace = true }
dashmap = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { workspace = true }
async-trait = { workspace = true }
async-stream = "0.3"
libc = "0.2"
# WhatsApp Cloud API webhook signature verification (X-Hub-Signature-256).
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }

[build-dependencies]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "time"] }
wiremock = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "soullink-gateway"
path = "src/main.rs"

[lib]
name = "soullink_gateway"
path = "src/lib.rs"
