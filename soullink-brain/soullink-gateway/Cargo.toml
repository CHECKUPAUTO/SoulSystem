[package]
name = "soullink-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Messaging gateway for SoulLink — routes Telegram/WhatsApp messages to/from the orchestrator"

[dependencies]
soullink-core = { path = "../soullink-core" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
toml = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "time"] }
wiremock = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "soullink-gateway"
path = "src/main.rs"

[lib]
name = "soullink_gateway"
path = "src/lib.rs"
