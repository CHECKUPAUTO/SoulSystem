[package]
name = "soullink-allowlist"
version = "0.1.0"
edition = "2021"
description = "Domain allowlist with wildcard matching for network access control (IronClaw-inspired)"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
url = "2"

[dev-dependencies]
serde_json = "1"
