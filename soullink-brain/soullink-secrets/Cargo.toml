[package]
name = "soullink-secrets"
version = "0.1.0"
edition = "2021"
description = "AES-256-GCM encrypted secret store with HKDF key derivation (IronClaw-inspired)"

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
secrecy = "0.8"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
bincode = "1"
tokio = { version = "1", features = ["fs", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
