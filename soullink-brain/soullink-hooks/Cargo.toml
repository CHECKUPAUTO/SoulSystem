[package]
name = "soullink-hooks"
version = "0.1.0"
edition = "2021"
description = "Lifecycle hooks for SoulLink operations (IronClaw-inspired)"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
