[package]
name = "soullink-cli"
version.workspace = true
edition.workspace = true
description = "SoulLink V13.5 — Knowledge Pipeline CLI"

[[bin]]
name = "soullink"
path = "src/main.rs"

[dependencies]
soullink-rag = { path = "../soullink-rag" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json", "blocking"] }
uuid = { workspace = true }
fs_extra = "1"