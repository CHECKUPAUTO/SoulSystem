[package]
name = "soullink-dali"
version = "0.1.0"
edition = "2021"

[features]
# Stub mode by default; enable `dali` on machines with the NVIDIA DALI SDK
# (e.g. Jetson) for the real FFI bindings.
default = []
dali = ["dep:cxx"]

[dependencies]
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cxx = { version = "1", optional = true }

[build-dependencies]
cxx-build = { version = "1" }
cc = { version = "1" }
