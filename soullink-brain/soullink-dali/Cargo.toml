[package]
name = "soullink-dali"
version = "0.1.0"
edition = "2021"

[features]
default = ["dali"]
dali = ["dep:cxx"]

[dependencies]
thiserror = "1.0"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cxx = { version = "1", optional = true }

[build-dependencies]
cxx-build = { version = "1" }
cc = { version = "1" }