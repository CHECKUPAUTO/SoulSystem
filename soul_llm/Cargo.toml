[package]
name = "soul_llm"
version = "0.2.0"
edition = "2021"
description = "Multi-provider LLM client with streaming, token budgeting, and connection pooling"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/OS-AGENTS"
keywords = ["llm", "openai", "anthropic", "ollama", "streaming", "multi-provider"]
categories = ["machine-learning", "api-client", "async", "network-programming"]

[dependencies]
soulsystem-common = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
parking_lot = { workspace = true }
futures = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
