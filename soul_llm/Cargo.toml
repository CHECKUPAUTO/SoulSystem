[package]
name = "soul_llm"
version = "0.2.0"
edition = "2021"
description = "Ollama LLM client with conversation context, streaming, and tool calling"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
thiserror = "2"
