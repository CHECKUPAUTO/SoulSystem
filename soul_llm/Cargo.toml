[package]
name = "soul_llm"
version = "0.1.0"
edition = "2021"
description = "Pure Rust HTTP client for Ollama LLM inference with connection pooling, token budgeting, and streaming support"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/OS-AGENTS"
keywords = ["llm", "ollama", "http-client", "streaming", "token-budget", "connection-pool"]
categories = ["machine-learning", "api-client", "async", "network-programming"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
