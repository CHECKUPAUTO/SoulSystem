[package]
name = "soul_llm"
version = "0.1.0"
edition = "2021"
description = "Client HTTP pur Rust vers Ollama — le cerveau de SoulSystem"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
