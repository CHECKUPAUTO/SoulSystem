[package]
name = "soul_orchestrator"
version = "0.1.0"
edition = "2021"
description = "Event-driven agent orchestrator with identity-based routing, MPSC mailboxes per agent, and lifecycle management"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/OS-AGENTS"
keywords = ["orchestrator", "agent", "routing", "mpsc", "lifecycle", "event-driven"]
categories = ["embedded", "os", "concurrency"]

[dependencies]
soul_ipc = { path = "../soul_ipc" }
prometheus = { workspace = true }
lazy_static = { workspace = true }
