[package]
name = "soul_tools"
version = "0.2.0"
edition = "2021"
description = "Tool discovery, execution, file operations, and permission model"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
