name: Jules — AVID v3 Hardening

on:
  workflow_dispatch:
    inputs:
      focus:
        description: 'Domaine à focaliser (all, db, sandbox, tui, scout)'
        required: false
        default: 'all'

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Invoke Jules
        uses: google-labs-code/jules-invoke@v1.0.0
        with:
          prompt: |
            Tu es l'architecte d'AVID. Mission : durcir et améliorer le système.
            827 fichiers Rust, 12 crates, pipeline Planner→Designer→Critic→AntiClone→Sandbox.

            Priorité 1 — SQLite : ajouter busy_timeout + Mutex global + pool max_size=4
            Priorité 2 — LLM resilience : retry avec backoff, circuit breaker 5 échecs→pause 30s
            Priorité 3 — Sandbox : timeout subprocess, seccomp basique, test anti-écriture /etc
            Priorité 4 — TUI : statut workers temps réel, historique tâches, barre progression
            Priorité 5 — Scout : 5-10 nouveaux extracteurs (openapi, graphql, license, changelog...)

            Règles :
            - Zero stub
            - cargo check + cargo test doivent passer
            - Tests unitaires pour tout nouveau code
            - PR avec tous les changements
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: 'main'
