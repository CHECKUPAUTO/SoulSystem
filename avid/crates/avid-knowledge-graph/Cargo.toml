[package]
name = "avid-knowledge-graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Memory Tree / Knowledge Graph for AVID — entity-relationship graph backed by SQLite with LLM extraction"
repository = "https://github.com/CHECKUPAUTO/AVID"
documentation = "https://docs.rs/avid-knowledge-graph"
keywords = ["knowledge-graph", "entity", "relationship", "memory-tree", "sqlite"]
categories = ["development-tools", "data-structures"]

[dependencies]
avid-core = { path = "../avid-core" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0"

[dev-dependencies]
tempfile = "3"
