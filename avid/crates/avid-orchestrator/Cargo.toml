[package]
name = "avid-orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
avid-core = { path = "../avid-core" }
avid-scout = { path = "../avid-scout" }
avid-vision = { path = "../avid-vision" }
avid-cortex = { path = "../avid-cortex" }
avid-mimic = { path = "../avid-mimic" }
avid-forge = { path = "../avid-forge" }
avid-anticlone = { path = "../avid-anticlone" }
avid-sandbox = { path = "../avid-sandbox" }
avid-tokenjuice = { path = "../avid-tokenjuice" }
avid-model-router = { path = "../avid-model-router" }
avid-knowledge-graph = { path = "../avid-knowledge-graph" }
avid-skills = { path = "../avid-skills" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tracing = "0"
prometheus = { version = "0", features = ["process"] }
time = "0"
hex = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
r2d2 = "0.8"
r2d2_sqlite = "0.25"
wiremock = "0.6"
