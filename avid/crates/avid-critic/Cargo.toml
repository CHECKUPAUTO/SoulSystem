[package]
name = "avid-critic"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Auto-reviewer for AVID — AST validation and repair loop for mimic output"
repository = "https://github.com/CHECKUPAUTO/AVID"
documentation = "https://docs.rs/avid-critic"
keywords = ["review", "ast", "sandbox", "mimic", "repair"]
categories = ["development-tools"]

[dependencies]
avid-core = { path = "../avid-core" }
avid-mimic = { path = "../avid-mimic" }
avid-sandbox = { path = "../avid-sandbox" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "full"] }
tracing = "0"
thiserror = "2"
rustpython-parser = "0.4"
rustpython-ast = "0.4"
