[package]
name = "avid-anticlone"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Python AST fingerprinting and structural similarity engine for code originality detection"
repository = "https://github.com/CHECKUPAUTO/AVID"
documentation = "https://docs.rs/avid-anticlone"
keywords = ["ast", "fingerprint", "similarity", "python", "originality"]
categories = ["development-tools", "parsing"]

[dependencies]
rustpython-parser = "0.4"
rustpython-ast = { version = "0.4", features = ["visitor"] }
serde = { workspace = true }
serde_json = "1"
thiserror = "2"
garde = { version = "0", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
