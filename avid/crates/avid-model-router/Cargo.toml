[package]
name = "avid-model-router"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Intelligent model router with capability-based selection and fallback chains for AVID"
repository = "https://github.com/CHECKUPAUTO/AVID"
documentation = "https://docs.rs/avid-model-router"
keywords = ["llm", "model", "router", "ollama", "ai"]
categories = ["development-tools", "web-programming"]

[dependencies]
avid-core = { path = "../avid-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
