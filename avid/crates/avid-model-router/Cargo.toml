[package]
name = "avid-model-router"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Intelligent model router with capability-based selection and fallback chains for AVID"
repository = "https://github.com/CHECKUPAUTO/AVID"
documentation = "https://docs.rs/avid-model-router"
keywords = ["llm", "model", "router", "ollama", "ai"]
categories = ["development-tools", "web-programming"]

[dependencies]
avid-core = { path = "../avid-core", optional = true }

serde = { workspace = true }
serde_json = "1"
thiserror = "2"
tracing = "0"
clap = { workspace = true, optional = true }

[features]
default = ["cli", "llm-client"]
# The `avid-route` command-line tool (learned cost-aware routing).
cli = ["dep:clap"]
# `create_llm_client` helper that builds an avid-core LlmClient from a profile.
# Optional so lean consumers (e.g. the gateway) can embed the routing logic
# without pulling the heavy avid-core dependency tree.
llm-client = ["dep:avid-core"]

[[bin]]
name = "avid-route"
required-features = ["cli"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
