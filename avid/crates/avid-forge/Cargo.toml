[package]
name = "avid-forge"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Production-grade code synthesis and optimization engine for the AVID system"

[dependencies]
avid-core = { path = "../avid-core" }
thiserror = "2"
anyhow = "1"
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
tracing = "0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
