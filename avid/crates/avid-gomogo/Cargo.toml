[package]
name = "avid-gomogo"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "API Reverse Engineering (HTTP Scanner, MITM Proxy, Captcha Farm) — integrated into AVID"
repository = "https://github.com/CHECKUPAUTO/AVID"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "string"] }
# HTTP client
reqwest = { workspace = true, features = ["http2"] }
tokio = { workspace = true }
# Proxy server
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
# TLS / MITM
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.12"
x509-parser = "0.16"
httparse = "1"
# Captcha farm server
actix-web = "4"
actix-ws = "0.3"
actix-files = "0.6"
# Config
toml = "0.8"
dirs = "6"
# Utility
anyhow = "1"
url = "2"
regex = "1"
serde = { workspace = true }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-log = "0.2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rand = "0.10"
chrono = { workspace = true }

[dev-dependencies]
actix-rt = "2"
actix-test = "0.1"
