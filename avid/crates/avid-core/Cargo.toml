[package]
name = "avid-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "LLM-driven agent pipeline, task orchestration, queue, and memory persistence for the AVID system"
repository = "https://github.com/CHECKUPAUTO/AVID"
documentation = "https://docs.rs/avid-core"
keywords = ["llm", "agent", "orchestrator", "queue", "ollama"]
categories = ["development-tools"]

[dependencies]
soulsystem-common = { workspace = true }
avid-anticlone = { path = "../avid-anticlone" }
avid-sandbox = { path = "../avid-sandbox" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1"
garde = { version = "0", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0"
tracing-subscriber = { version = "0", features = ["json", "env-filter"] }
prometheus = { version = "0", features = ["process"] }
dotenvy = "0.15"
redis = { version = "0.27", features = ["tokio-comp"] }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
reqwest = { workspace = true }
subtle = "2"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"
time = "0"
humantime = "2"
sha2 = "0.10"
hex = "0.4"
rustpython-parser = "0.4"
rustpython-ast = "0.4"
