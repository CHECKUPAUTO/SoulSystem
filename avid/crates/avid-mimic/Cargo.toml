[package]
name = "avid-mimic"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Intelligent cloning engine for the AVID autonomous system"

[dependencies]
serde_json = "1"
rustpython-parser = "0.4"
avid-core = { path = "../avid-core" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "full"] }
tracing = "0"
garde = { version = "0", features = ["derive"] }
async-trait = "0.1"
chromiumoxide = { version = "0.7", features = ["async-std-runtime"] }
thirtyfour = "0.34"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
