[package]
name = "avid-anticlone-service"
version = "0.1.0"
edition = "2021"
description = "Service HTTP standalone exposant avid-anticlone — api.piw.fr"
license = "MIT OR Apache-2.0"

[[bin]]
name = "avid-anticlone-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace", "cors"] }
tower_governor = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
subtle = "2"
tracing = "0"
tracing-subscriber = { version = "0", features = ["json", "env-filter"] }
anyhow = "1"
thiserror = "2"
prometheus = "0"
sha2 = "0.10"
hex = "0.4"
time = "0.3"
