[package]
name = "agent-registry"
version = "0.1.0"
edition = "2021"
description = "Agent d'orchestration — wire SoulSystem, orchestrateur, AVID, scirust, SoulNeural, openevolve, synergie en un point central"

[[bin]]
name = "agent_registry"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Bridges (PHASE 5 — wire-up central)
orchestrator-bridge = { path = "../orchestrator-bridge" }
avid-bridge = { path = "../avid-bridge" }
openevolve-bridge = { path = "../openevolve-bridge" }
mesh-bridge = { path = "../mesh-bridge" }
services-bridge = { path = "../services-bridge" }
organs-bridge = { path = "../organs-bridge" }
brain-bridge = { path = "../brain-bridge" }
soul-neural-bridge = { path = "../soul-neural-bridge" }
synergie-bridge = { path = "../synergie-bridge" }
forge-bridge = { path = "../forges/forge-bridge" }

[[bin]]
name = "e2e"
path = "src/bin/e2e.rs"
