# =============================================================================
# SYNERGIE v3 — Configuration exemple
# =============================================================================
# Copie ce fichier vers /etc/synergie/synergie.toml et adapte aux besoins.

# --- Agent ----------------------------------------------------------------
[agent]
# Intervalle entre deux scans en daemon (en secondes). 21600 = 6 h.
tick_seconds       = 21600
# Score ajusté minimum pour qu'une synergie déclenche une action automatique.
action_threshold   = 3.0
# Nombre max d'actions auto par tick (Telegram + scaffolding).
max_actions_per_tick = 3
# Si true : aucune écriture FS/git en automatique (mode prévisualisation).
dry_run            = false
# Si true : envoi Telegram à chaque action.
notify_on_action   = true
# Nombre de commits git analysés pour la matrice de co-commits.
git_window         = 300
# Délai (jours) avant qu'une synergie disparue ne soit marquée Stale.
stale_after_days   = 14

# --- Écosystème -----------------------------------------------------------
[ecosystem]
# Racines scannées. Tout sous-dossier contenant un manifest reconnu
# (Cargo.toml, package.json, pyproject.toml, setup.py, requirements.txt, go.mod)
# devient un "projet".
roots = [
    "/root/soullink-brain",
    "/root/soullink-organs",
    "/root/openclaw-cre",
    "/root/.openclaw/workspace",
    "/root/openevolve",
    "/mnt/nvme_secondary/system_root/AVID",
    "/root/aris",
    "/root/cortex",
]
max_depth          = 6
respect_gitignore  = true
max_file_size      = 2097152  # 2 MiB
ignore = [
    "/target/",
    "/node_modules/",
    "/\\.venv/",
    "/\\.git/",
    "/dist/",
    "/build/",
    "\\.lock$",
    "/__pycache__/",
]

# --- Embeddings -----------------------------------------------------------
[embed]
enabled               = true
# "local" → scirust_core::embed::EmbeddingEngine  (128 dim, instantané)
# "http"  → TRIBE Snowflake Arctic (768 dim, MTEB 69.8 #1)
mode                  = "local"
endpoint              = "http://127.0.0.1:7440/embed"
dim                   = 128
timeout_seconds       = 15
similarity_threshold  = 0.86

# --- Persistance ----------------------------------------------------------
[persistence]
path         = "/mnt/nvme/soullink_brain/synergies/synergie.sled"
reports_dir  = "/mnt/nvme/soullink_brain/synergies/reports"
max_history  = 50

# --- API HTTP/WebSocket --------------------------------------------------
[api]
bind            = "127.0.0.1"
port            = 7460
ws_path         = "/ws"
cors_allow_any  = true
# Token Bearer requis sur tous les endpoints si défini.
# auth_token    = "change-me"

# --- Actions ---------------------------------------------------------------
[action]
auto_apply_safe_patches = false
branch_prefix           = "synergie/auto/"
# Notifications Telegram (sinon override par les vars d'env du même nom).
# telegram_bot_token    = "1234567:AAAA..."
# telegram_chat_id      = "@my_channel"
# Repo local cloné où sont écrits les scaffoldings (et poussés via /sync/github).
# github_proposals_repo = "/root/synergie-proposals"
github_remote           = "origin"

# --- Détecteurs ----------------------------------------------------------
[detectors]
# Existant (scirust-symbolic — équivalence d'expressions math).
symbolic          = true
# Nouveaux v3 :
duplicate         = true   # MinHash + LSH + Jaccard ≥ 0.75
semantic          = true   # Embeddings (cf. [embed]) + cosine
deps_graph        = true   # Dépendances partagées + Fusion (Jaccard ≥ 0.30)
api_surface       = true   # Producer/Consumer/Transformer
config_drift      = true   # Clés TOML/YAML/.env ≥ 50 % communes
port_overlap      = true   # Ports identiques ou voisins ≤ 16
cocommit          = true   # Co-commits git (Jaccard ≥ 0.55)
lang_bridge       = true   # Rust ↔ Python sur même nom
doc_xref          = true   # READMEs croisés
# Paramètres fins :
minhash_signatures    = 128
duplicate_jaccard_min = 0.75
semantic_threshold    = 0.86
cocommit_window       = 200
