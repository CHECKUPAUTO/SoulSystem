[package]
name = "synergie"
version = "0.3.0"
edition = "2021"
authors = ["SoulLink <soullink@checkupauto.ai>"]
description = "Agent autonome de détection de synergies dans l'écosystème SoulLink"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/SYNERGIE"

[workspace]

[dependencies]
# Existantes — conservées telles quelles
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2"
scirust-symbolic = { path = "/root/scirust/scirust-symbolic" }
regex = "1"
anyhow = "1"
reqwest = { workspace = true }
sled = "0.34"
bincode = "1"
scirust-autodiff = { path = "/root/scirust/scirust-autodiff" }

# Nouvelles deps v3
scirust-core = { path = "/root/scirust/scirust-core" }   # EmbeddingEngine local
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = "1"
rayon = "1"
git2 = { version = "0.19", default-features = false, features = ["vendored-openssl"] }
petgraph = "0.6"
blake3 = "1"
twox-hash = "1"
chrono = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
dashmap = "6"
hex = "0.4"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
