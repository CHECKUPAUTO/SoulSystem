# cargo-deny configuration
# Install: cargo install cargo-deny --locked
# Run: cargo deny check

[dependencies]
# Allow duplicates where version difference is acceptable
skip = [
    { name = "ahash" },
    { name = "getrandom" },
    { name = "cpufeatures" },
]
skip-tree = [
    { name = "criterion" },
]

[advisories]
unmaintained = "deny"
notice = "deny"
unsound = "deny"
severity-threshold = "low"
ignore = []

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
]
default = "deny"
confidence-threshold = 0.92

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
deny = []
skip = [
    { name = "ahash" },
    { name = "getrandom" },
    { name = "cpufeatures" },
]