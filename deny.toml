# cargo-deny configuration
# Install: cargo install cargo-deny --locked
# Run: cargo deny check

[advisories]
# `unmaintained`/`unsound` select which crates cargo-deny checks for these
# advisory categories ("all" = every crate in the graph, not just direct
# workspace deps) — the pre-0.16 config had these as lint-level strings
# ("deny"), which no longer parses; severity-threshold below is what
# actually controls pass/fail.
unmaintained = "all"
unsound = "all"
ignore = [
    # rustls-webpki/rsa advisories previously ignored here no longer match
    # anything in the current dependency graph (cargo-deny reports them as
    # stale "advisory-not-detected" warnings) — removed rather than kept as
    # dead config. Re-check with `cargo deny check` before reintroducing any
    # of RUSTSEC-2023-0071 / RUSTSEC-2026-0098 / RUSTSEC-2026-0099 /
    # RUSTSEC-2026-0104 if a dependency bump brings the affected versions
    # back into the tree.
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained; transitive via reqwest 0.11 -> teloxide-core -> teloxide. No safe upgrade (would require migrating reqwest 0.11's TLS stack). Tracked, not blocking.
    "RUSTSEC-2017-0008", # `serial` unmaintained; transitive via portable-pty -> pty-terminal. No safe upgrade available upstream in portable-pty. Tracked, not blocking.
    "RUSTSEC-2025-0141", # Bincode unmaintained. No safe upgrade available. Tracked, not blocking.
    "RUSTSEC-2025-0057", # fxhash unmaintained; transitive via sled. No safe upgrade available upstream in sled. Tracked, not blocking.
    "RUSTSEC-2024-0384", # `instant` unmaintained; transitive via sled. No safe upgrade available upstream in sled. Tracked, not blocking.
    "RUSTSEC-2024-0436", # paste unmaintained. No safe upgrade available. Tracked, not blocking.
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained; transitive via teloxide -> aquamarine. No safe upgrade available upstream. Tracked, not blocking.
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    # Weak (file-level) copyleft: modifications to the licensed file itself
    # must stay MPL-2.0, but does not extend to code that merely links/
    # depends on it, unlike GPL-style copyleft. OSI-approved and FSF-free.
    # Pulled in transitively by colored (terminal color output) and
    # option-ext/dirs-sys (XDG path resolution).
    "MPL-2.0",
    # Permissive data license (not a code license) used by webpki-roots for
    # the Mozilla CA root-certificate bundle it ships — no copyleft terms.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.92

[licenses.private]
# Crates marked `publish = false` (never published to crates.io) are
# internal-only — license compliance for external redistribution doesn't
# apply to them the way it does for a real dependency, so skip the check
# rather than requiring every one to carry a matching license field.
ignore = true

[bans]
# Warn on multiple versions instead of deny, since many are transitive
# and can't be resolved without upstream changes
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = [
    { name = "getrandom" },
    { name = "windows-sys" },
    { name = "nix" },
    { name = "tungstenite" },
    { name = "hashbrown" },
    { name = "itertools" },
    { name = "tokio-tungstenite" },
    { name = "rand" },
    { name = "hyper" },
    { name = "h2" },
    { name = "reqwest" },
    { name = "base64" },
]
# Allow duplicates where version difference is acceptable — these crates
# have many versions in the graph due to transitive deps via multiple major
# framework versions, and can't be resolved without upstream changes.
skip-tree = [
    { name = "criterion" },
    { name = "windows-sys" },
    { name = "nix" },
    { name = "tungstenite" },
    { name = "hashbrown" },
    { name = "itertools" },
    { name = "tokio-tungstenite" },
    { name = "rand" },
    { name = "hyper" },
    { name = "h2" },
    { name = "reqwest" },
    { name = "rustls" },
    { name = "base64" },
    { name = "shlex" },
    { name = "teloxide" },
]