[package]
name = "soul_gateway"
version = "0.1.0"
edition = "2021"
description = "HTTP/WS API gateway for autonomous entity control with OpenClaw-compatible interface, TLS, and CORS support"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/OS-AGENTS"
keywords = ["gateway", "http", "websocket", "api", "opencawl", "tls", "cors", "axum"]
categories = ["web-programming", "async", "network-programming", "api"]

[dependencies]
soul-cors = { workspace = true }
soulsystem-common = { workspace = true }
axum = { version = "0.7", features = ["ws", "json", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tower-http = { workspace = true }
# `limit` for the shared-semaphore concurrency bound, `util` for `ServiceExt`.
tower = { workspace = true, features = ["limit"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
parking_lot = { workspace = true }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
teloxide = { version = "0.17", features = ["macros", "ctrlc_handler"] }
reqwest = { workspace = true }
futures-util = { workspace = true }

hmac = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
