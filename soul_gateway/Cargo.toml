[package]
name = "soul_gateway"
version = "0.1.0"
edition = "2021"
description = "HTTP/WS API gateway for autonomous entity control with OpenClaw-compatible interface, TLS, and CORS support"
license = "MIT"
repository = "https://github.com/CHECKUPAUTO/OS-AGENTS"
keywords = ["gateway", "http", "websocket", "api", "opencawl", "tls", "cors", "axum"]
categories = ["web-programming", "async", "network-programming", "api"]

[dependencies]
axum = { version = "0.7", features = ["ws", "json", "macros"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
parking_lot = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rustls = "0.23"
rustls-pemfile = "1.0"
teloxide = { version = "0.13", features = ["macros", "ctrlc_handler"] }
reqwest = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
