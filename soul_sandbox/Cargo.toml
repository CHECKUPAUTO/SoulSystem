[package]
name = "soul_sandbox"
version = "0.2.0"
edition = "2021"
description = "Sandbox d'exécution robuste : parser shell, normalisation, listes noires, setpgid, journalisation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
thiserror = "1"
libc = "0.2"
seccomp = "0.1"

[dev-dependencies]
proptest = "1"
